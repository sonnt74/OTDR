[build]
  # Lệnh này sẽ được Netlify tự động chạy khi có bản cập nhật mới
  command = "npm install -g javascript-obfuscator && mkdir -p dist && javascript-obfuscator admin.js --output dist/admin.js --compact true --control-flow-flattening true --rename-globals false && javascript-obfuscator auth.js --output dist/auth.js --compact true --control-flow-flattening true --rename-globals false && javascript-obfuscator config.js --output dist/config.js --compact true --control-flow-flattening true --rename-globals false && javascript-obfuscator data.js --output dist/data.js --compact true --control-flow-flattening true --rename-globals false && javascript-obfuscator idb-helper.js --output dist/idb-helper.js --compact true --control-flow-flattening true --rename-globals false && javascript-obfuscator map.js --output dist/map.js --compact true --control-flow-flattening true --rename-globals false && javascript-obfuscator store.js --output dist/store.js --compact true --control-flow-flattening true --rename-globals false && javascript-obfuscator sw.js --output dist/sw.js --compact true --control-flow-flattening true --rename-globals false && sed -i 's|src=\"admin.js\"|src=\"dist/admin.js\"|g' index.html && sed -i 's|src=\"auth.js\"|src=\"dist/auth.js\"|g' index.html && sed -i 's|src=\"config.js\"|src=\"dist/config.js\"|g' index.html && sed -i 's|src=\"data.js\"|src=\"dist/data.js\"|g' index.html && sed -i 's|src=\"idb-helper.js\"|src=\"dist/idb-helper.js\"|g' index.html && sed -i 's|src=\"map.js\"|src=\"dist/map.js\"|g' index.html && sed -i 's|src=\"store.js\"|src=\"dist/store.js\"|g' index.html && sed -i 's|src=\"sw.js\"|src=\"dist/sw.js\"|g' index.html"
  
  # Thư mục xuất bản sau khi build xong
  publish = "."
