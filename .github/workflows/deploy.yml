name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev  # Thay bằng tên nhánh thứ 2 của bạn nếu khác

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Target Directory
        id: branch-dir
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            # Sửa từ "production" thành để trống (dấu chấm .) để nó nằm ngay ngoài thư mục gốc
            echo "dir=." >> $GITHUB_OUTPUT
          else
            # Nhánh dev vẫn giữ nguyên nằm trong thư mục con để xem preview song song
            echo "dir=preview-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: ${{ steps.branch-dir.outputs.dir }}
          keep_files: true
