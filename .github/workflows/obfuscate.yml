name: Tu dong lam roi va xu ly Production

on:
  push:
    branches: [ main ]

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tai ma nguon tu kho chua
        uses: actions/checkout@v3

      - name: Cai dat moi truong Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cai dat cong cu lam roi ma nguon javascript-obfuscator
        run: npm install -g javascript-obfuscator

      - name: Tao thu muc dist va ma hoa toan bo tep JS cua he thong
        run: |
          mkdir -p dist
          javascript-obfuscator admin.js --output dist/admin.js --compact true --control-flow-flattening true --rename-globals false
          javascript-obfuscator auth.js --output dist/auth.js --compact true --control-flow-flattening true --rename-globals false
          javascript-obfuscator config.js --output dist/config.js --compact true --control-flow-flattening true --rename-globals false
          javascript-obfuscator data.js --output dist/data.js --compact true --control-flow-flattening true --rename-globals false
          javascript-obfuscator idb-helper.js --output dist/idb-helper.js --compact true --control-flow-flattening true --rename-globals false
          javascript-obfuscator map.js --output dist/map.js --compact true --control-flow-flattening true --rename-globals false
          javascript-obfuscator store.js --output dist/store.js --compact true --control-flow-flattening true --rename-globals false
          javascript-obfuscator sw.js --output dist/sw.js --compact true --control-flow-flattening true --rename-globals false

      - name: Tu dong cap nhat duong dan trong index.html
        run: |
          sed -i 's|src="admin.js"|src="dist/admin.js"|g' index.html
          sed -i 's|src="auth.js"|src="dist/auth.js"|g' index.html
          sed -i 's|src="config.js"|src="dist/config.js"|g' index.html
          sed -i 's|src="data.js"|src="dist/data.js"|g' index.html
          sed -i 's|src="idb-helper.js"|src="dist/idb-helper.js"|g' index.html
          sed -i 's|src="map.js"|src="dist/map.js"|g' index.html
          sed -i 's|src="store.js"|src="dist/store.js"|g' index.html
          sed -i 's|src="sw.js"|src="dist/sw.js"|g' index.html

      - name: Tu dong xoa cac nut lenh danh rieng cho dev
        run: |
          python3 -c '
          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()
          import re
          new_content = re.sub(r"<!-- DEV_ONLY_START -->.*?<!-- DEV_ONLY_END -->", "", content, flags=re.DOTALL)
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(new_content)
          '

      - name: Cau hinh Git va day len nhanh main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ index.html
          git diff-index --quiet HEAD || git commit -m "🔒 Tu dong lam roi JS, cap nhat duong dan va go bo nut dev cho Production"
          git push
