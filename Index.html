<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ Thống GIS & Định Vị Cố OTDR - Supabase Raw Excel Import</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  
  <!-- SheetJS để đọc/ghi file Excel trực tiếp trên trình duyệt -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #control-panel {
      position: absolute; top: 15px; left: 15px; z-index: 1000; background: white;
      padding: 15px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      width: 330px; max-height: 92vh; overflow-y: auto; transition: max-height 0.3s ease;
    }
    .panel-header {
      background-color: #0d6efd; color: white; padding: 10px 12px; font-weight: bold;
      font-size: 14px; border-radius: 6px; margin-bottom: 12px; display: flex; align-items: center; cursor: pointer;
    }
    .panel-body-content { display: block; }
    .collapsed .panel-body-content { display: none; }
    .status-badge {
      background-color: #e8f4fd; color: #084298; border: 1px solid #b6effb;
      padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-bottom: 14px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #333; text-transform: uppercase; }
    .form-group select, .form-group input { width: 100%; padding: 7px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 12px; box-sizing: border-box; }
    .btn-action { background-color: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; padding: 11px; border-radius: 6px; font-size: 12px; width: 100%; margin-top: 4px; }
    .btn-options-main { background-color: #495057; color: white; border: none; font-weight: bold; cursor: pointer; padding: 10px; border-radius: 6px; font-size: 12px; width: 100%; margin-top: 8px; }
    .btn-chuanhoa { background-color: #6610f2; color: white; border: none; font-weight: bold; padding: 10px; border-radius: 4px; width: 100%; margin-top: 4px; cursor: pointer; }
    .btn-clear { background-color: #dc3545; color: white; border: none; font-weight: bold; padding: 10px; border-radius: 4px; width: 100%; margin-top: 4px; cursor: pointer; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 12px; background: #f8f9fa; padding: 6px 8px; border-radius: 4px; }
    .checkbox-group input { width: auto; }
    #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 99999; justify-content: center; align-items: center; color: #fff; font-size: 16px; flex-direction: column; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0d6efd; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 12px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #optionsModal, #customAlertModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 90%; max-width: 500px; max-height: 85vh; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 12px; font-weight: bold; color: #0d6efd; }
    .modal-body { overflow-y: auto; flex-grow: 1; font-size: 12px; }
    .gmaps-btn { background: #4285F4; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; margin-top: 6px; font-weight: bold; display: inline-flex; gap: 4px; text-decoration: none; }
    .mx-marker { width: 14px; height: 14px; background-color: #198754; border: 2px solid #fff; transform: rotate(45deg); box-shadow: 0 0 6px rgba(0,0,0,0.4); }
    .standard-marker { width: 10px; height: 10px; background-color: #0d6efd; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.4); }
    .point-a-marker { background: linear-gradient(135deg, #ffc107, #ff9800); color: #000; font-weight: bold; font-size: 12px; text-align: center; line-height: 28px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 14px rgba(255,193,7,0.9); }
    .point-b-marker { background: linear-gradient(135deg, #dc3545, #b02a37); color: #fff; font-weight: bold; font-size: 12px; text-align: center; line-height: 28px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 14px rgba(220,53,69,0.9); }
    .lytrinh-badge { background: #fd7e14; color: white; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; white-space: nowrap; }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-overlay-text">Đang kết nối Supabase...</div>
  </div>

  <div id="map"></div>

  <div id="control-panel">
    <div class="panel-header" onclick="toggleControlPanel()">
      <span>📊 HỆ THỐNG GIS & OTDR (SUPABASE)</span>
      <span id="panelToggleIcon" style="margin-left: auto; font-size: 12px;">▲ Thu gọn</span>
    </div>

    <div class="panel-body-content" id="panelBodyContent">
      <div id="statusBadge" class="status-badge"><span>🔄</span> Đang khởi tạo kết nối cơ sở dữ liệu...</div>

      <div class="form-group">
        <label>Chọn Tỉnh / Khu vực quản lý:</label>
        <select id="selectProvince" onchange="onProvinceChange()">
          <option value="TNN">Tỉnh Thái Nguyên (TNN)</option>
        </select>
      </div>

      <div class="form-group">
        <label>1. Chọn mã tuyến cáp (Bắt buộc):</label>
        <select id="selectTuyen" onchange="onTuyenChange()">
          <option value="ALL">-- Chọn tuyến cần hiển thị --</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Nguồn điểm đo (Trạm TNN / MX):</label>
        <select id="comboDiemA" onchange="onDiemAChange()">
          <option value="DEFAULT">🟢 Trạm TNN (21.593365, 105.839945)</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="chkNghichHuong" onchange="onDiemAChange()">
        <label for="chkNghichHuong" style="margin-bottom:0; cursor:pointer;">Đo nghịch hướng (Quay đầu tuyến)</label>
      </div>

      <div class="form-group">
        <label>3. Hệ số chùng cáp:</label>
        <input type="number" id="txtDoChung" value="1.075" step="0.001">
      </div>

      <div class="form-group">
        <label>4. Khoảng cách đo OTDR (km):</label>
        <input type="number" id="txtKcOtdr" value="3.5" step="0.1" placeholder="Nhập km từ máy đo...">
      </div>

      <div class="form-group">
        <button class="btn-action" onclick="timViTriDut()">🎯 PHÂN TÍCH & TÌM VỊ TRÍ SỰ CỐ</button>
        <button class="btn-options-main" onclick="document.getElementById('optionsModal').style.display='flex'">⚙️ TÙY CHỌN NÂNG CAO</button>
      </div>
    </div>
  </div>

  <!-- Options Modal -->
  <div id="optionsModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>⚙️ Tùy chọn hệ thống nâng cao</span>
        <button onclick="document.getElementById('optionsModal').style.display='none'" style="background:#dc3545; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">Đóng</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Chế độ định tuyến cáp:</label>
          <select id="cheDoDinhTuyen" onchange="onCheDoDinhTuyenChange()">
            <option value="standard">Bám Tuyến CSHT (Chuẩn STT)</option>
            <option value="road">Bám đường giao thông</option>
            <option value="manual">Tự vẽ thủ công</option>
          </select>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <button class="btn-chuanhoa" onclick="taiDuLieuTuSupabase(true)">🔄 TẢI LẠI DỮ LIỆU SUPABASE</button>
        </div>
        <div class="form-group">
          <button class="btn-chuanhoa" style="background:#198754;" onclick="document.getElementById('excelFileImportInput').click()">📥 IMPORT FILE EXCEL THÔ (CHƯA CHUẨN HÓA)</button>
          <input type="file" id="excelFileImportInput" accept=".xlsx, .xls" style="display:none;" onchange="importRawExcelToSupabase(event)">
        </div>
        <div class="form-group">
          <button class="btn-chuanhoa" style="background:#ffc107; color:#000;" onclick="exportSupabaseToExcelWeb()">📤 EXCEL DỮ LIỆU TỪ SUPABASE</button>
        </div>
        <div class="form-group">
          <button class="btn-clear" onclick="xoaTuyenThuCong()">🗑️ LÀM SẠCH BẢN ĐỒ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="customAlertModal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <div class="modal-header" style="justify-content: center; border-bottom: none;"><span id="customAlertTitle">Thông báo</span></div>
      <div class="modal-body" id="customAlertBody" style="padding: 10px 0;"></div>
      <div style="text-align: center; margin-top: 10px;">
        <button onclick="closeCustomAlert()" style="background:#0d6efd; color:white; border:none; padding:8px 20px; border-radius:4px; cursor:pointer; font-weight:bold;">Đã hiểu</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <script>
    // Cấu hình Supabase (Thay thông tin thực tế của anh vào đây)
    const SUPABASE_URL = 'https://lmxbzjislncqkwmcnlgy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_nRRO1mpzjiCLRI57LihWyQ_DZhWZ9HK';
    var supabaseClient = null;

    var map;
    var markersLayer = L.markerClusterGroup({ maxClusterRadius: 40 });
    var mxLayer = L.layerGroup();
    var polylinesLayer = L.layerGroup();
    var lyTrinhLayer = L.layerGroup();
    var globalDataPoints = [];
    var customManualPoints = [];

    var measureActive = false;
    var measurePoints = [];
    var measureMarkers = [];
    var measurePolyline = null;

    function showAlert(msg, title = "Thông báo") {
      document.getElementById('customAlertTitle').textContent = title;
      document.getElementById('customAlertBody').textContent = msg;
      document.getElementById('customAlertModal').style.display = 'flex';
    }
    function closeCustomAlert() { document.getElementById('customAlertModal').style.display = 'none'; }
    function toggleControlPanel() {
      var panel = document.getElementById('control-panel');
      panel.classList.toggle('collapsed');
      document.getElementById('panelToggleIcon').textContent = panel.classList.contains('collapsed') ? '▼ Mở rộng' : '▲ Thu gọn';
    }

    window.onload = function() {
      var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19 });
      var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 19 });

      map = L.map('map', { center: [21.5942, 105.8481], zoom: 13, maxZoom: 21, layers: [osm] });
      polylinesLayer.addTo(map); markersLayer.addTo(map); mxLayer.addTo(map); lyTrinhLayer.addTo(map);

      L.control.layers(
        { "Bản đồ OSM": osm, "Vệ tinh": sat }, 
        { "Cáp quang": polylinesLayer, "Mốc & Cột": markersLayer, "Măng xông (MX)": mxLayer, "Lý trình": lyTrinhLayer }, 
        { position: 'topright' }
      ).addTo(map);

      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        taiDuLieuTuSupabase(false);
      } catch (err) {
        showAlert("Lỗi khởi tạo Supabase Client: " + err.message);
      }
    };

    function showLoading(text) {
      document.getElementById('loading-overlay-text').textContent = text || "Đang xử lý...";
      document.getElementById('loading-overlay').style.display = 'flex';
    }
    function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

    function onProvinceChange() { taiDuLieuTuSupabase(false); }

    async function taiDuLieuTuSupabase(forceRefresh = false) {
      var statusBadge = document.getElementById('statusBadge');
      var provinceCode = document.getElementById('selectProvince').value;

      if (!forceRefresh) {
        var cached = localStorage.getItem('gis_data_cache_' + provinceCode);
        if (cached) {
          try {
            globalDataPoints = JSON.parse(cached);
            if (globalDataPoints && globalDataPoints.length > 0) {
              capNhatDanhSachTuyen(globalDataPoints);
              statusBadge.innerHTML = "<span>⚡</span> Đã tải bộ nhớ tạm (" + globalDataPoints.length + " điểm).";
              return;
            }
          } catch(e) { localStorage.removeItem('gis_data_cache_' + provinceCode); }
        }
      }

      showLoading("Đang tải dữ liệu từ Supabase...");
      statusBadge.innerHTML = "<span>⏳</span> Đang truy vấn cơ sở dữ liệu...";

      try {
        let { data, error } = await supabaseClient
          .from('chi_tiet')
          .select(`
            stt,
            ly_trinh,
            du_tru,
            do_cach,
            tuyen!inner(ma_tuyen, tinh_id, tinh!inner(ma_tinh)),
            diem!inner(ten_diem, loai, lat, long)
          `)
          .eq('tuyen.tinh.ma_tinh', provinceCode);

        if (error) throw error;

        if (!data || data.length === 0) {
          hideLoading();
          statusBadge.innerHTML = "<span>⚠️</span> Không có dữ liệu tuyến cáp cho tỉnh " + provinceCode;
          globalDataPoints = [];
          capNhatDanhSachTuyen(globalDataPoints);
          return;
        }

        globalDataPoints = data.map(function(item) {
          return {
            ten: item.diem.ten_diem,
            lat: item.diem.lat,
            long: item.diem.long,
            loai: item.diem.loai,
            tuyenList: [item.tuyen.ma_tuyen],
            lyTrinh: item.ly_trinh || '',
            duTru: parseFloat(item.du_tru) || 0,
            stt: parseFloat(item.stt) || 0,
            doCachTnn: item.do_cach || ''
          };
        });

        try { localStorage.setItem('gis_data_cache_' + provinceCode, JSON.stringify(globalDataPoints)); } catch(e){}
        capNhatDanhSachTuyen(globalDataPoints);
        hideLoading();
        statusBadge.innerHTML = "<span>✅</span> Đồng bộ thành công (" + globalDataPoints.length + " điểm từ Supabase).";

      } catch (err) {
        hideLoading();
        showAlert("Lỗi kết nối Supabase: " + err.message, "Lỗi CSDL");
        statusBadge.innerHTML = "<span>❌</span> Lỗi kết nối Supabase.";
      }
    }

    // ==========================================
    // CHỨC NĂNG IMPORT FILE EXCEL THÔ (CHƯA CHUẨN HÓA) TRỰC TIẾP TRÊN WEB
    // ==========================================
    async function importRawExcelToSupabase(event) {
      var file = event.target.files[0];
      if (!file) return;

      var provinceCode = document.getElementById('selectProvince').value;
      var provinceName = provinceCode === 'TNN' ? 'Tỉnh Thái Nguyên' : 'Tỉnh Quản Lý';

      showLoading("Đang đọc file Excel thô...");

      var reader = new FileReader();
      reader.onload = async function(e) {
        try {
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, { type: 'array' });

          showLoading("Đang khởi tạo thông tin tỉnh...");
          var provRes = await supabaseClient.from('tinh').upsert({
            ma_tinh: provinceCode,
            ten_tinh: provinceName,
            cau_hinh: { default_zoom: 13, center: [21.5942, 105.8481] }
          }, { onConflict: 'ma_tinh' }).select();

          if (provRes.error) throw provRes.error;
          var tinhId = provRes.data[0].id;

          var allPointsMap = new Map();
          var routeNamesSet = new Set();
          var rawRoutePoints = [];
          var globalRowCounter = 0;

          for (var sIdx = 0; sIdx < workbook.SheetNames.length; sIdx++) {
            var sheetName = workbook.SheetNames[sIdx] || ('Sheet' + sIdx);
            var sheet = workbook.Sheets[sheetName];
            if (!sheet) continue;
            
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            if (!rows || rows.length === 0) continue;

            var headerIdx = 0;
            var iTen = 0, iLat = 1, iLong = 2, iTuyen = 3, iLyTrinh = 4, iDuTru = 5, iDoCach = 6;

            for (var r = 0; r < Math.min(rows.length, 5); r++) {
              var rowArr = rows[r];
              if (!Array.isArray(rowArr)) continue;
              for (var c = 0; c < rowArr.length; c++) {
                var cellVal = String(rowArr[c] || '').trim().toLowerCase();
                if (cellVal.includes('tên') || cellVal.includes('ten') || cellVal.includes('diem') || cellVal.includes('lat') || cellVal.includes('vĩ')) {
                  headerIdx = r;
                  break;
                }
              }
            }

            var headerRow = rows[headerIdx] || [];
            var h = headerRow.map(function(item) { 
              return (item !== undefined && item !== null) ? String(item).trim().toLowerCase() : ''; 
            });

            for (var c = 0; c < h.length; c++) {
              var colName = h[c];
              if (colName.includes('tên') || colName.includes('ten') || colName.includes('mã') || colName.includes('diem') || colName.includes('điểm')) iTen = c;
              else if (colName === 'lat' || colName.includes('vĩ') || colName.includes('vi_do')) iLat = c;
              else if (colName === 'long' || colName.includes('lng') || colName.includes('kinh') || colName.includes('kinh_do')) iLong = c;
              else if (colName.includes('tuyen') || colName.includes('tuyến') || colName.includes('thu_muc') || colName.includes('nhom')) iTuyen = c;
              else if (colName.includes('lytrinh') || colName.includes('lý trình') || colName.includes('ly_trinh')) iLyTrinh = c;
              else if (colName.includes('du_tru') || colName.includes('dự trữ')) iDuTru = c;
              else if (colName.includes('do_cach') || colName.includes('đo cách')) iDoCach = c;
            }

            var isMx = String(sheetName).toLowerCase().includes('mang_xong') || String(sheetName).toLowerCase().includes('mx');
            var defaultType = isMx ? "Mang xong" : (String(sheetName).toLowerCase().includes('cot') ? "Cot" : "Be");

            for (var r = headerIdx + 1; r < rows.length; r++) {
              var row = rows[r];
              if (!row || !Array.isArray(row)) continue;

              var rawTen = row[iTen];
              var tenVal = (rawTen !== undefined && rawTen !== null && String(rawTen).trim() !== '') ? String(rawTen).trim().substring(0, 250) : null;
              if (!tenVal || tenVal.toLowerCase() === 'nan' || tenVal.toLowerCase() === 'undefined') continue;

              var latVal = parseFloat(row[iLat]);
              var lngVal = parseFloat(row[iLong]);
              if (isNaN(latVal) || isNaN(lngVal) || latVal === 0 || lngVal === 0) continue;

              globalRowCounter++;
              var rawLyTrinh = row[iLyTrinh];
              var lyTrinhVal = (rawLyTrinh !== undefined && rawLyTrinh !== null && String(rawLyTrinh).trim() !== '') ? String(rawLyTrinh).trim().substring(0, 100) : null;
              
              var rawDuTru = row[iDuTru];
              var duTruVal = (rawDuTru !== undefined && rawDuTru !== null && !isNaN(rawDuTru)) ? parseFloat(rawDuTru) : 0;
              
              var rawDoCach = row[iDoCach];
              var doCachVal = (rawDoCach !== undefined && rawDoCach !== null && String(rawDoCach).trim() !== '') ? String(rawDoCach).trim().substring(0, 250) : null;

              var loaiHt = defaultType;
              var tLower = tenVal.toLowerCase();
              if (tLower.includes('mốc') || tLower.includes('moc')) loaiHt = "Moc";
              else if (tLower.includes('mx') || tLower.includes('măng xông') || tLower.includes('mang xong')) loaiHt = "Mang xong";
              else if (tLower.includes('cột') || tLower.includes('cot')) loaiHt = "Cot";
              else if (tLower.includes('bể') || tLower.includes('be')) loaiHt = "Be";

              allPointsMap.set(tenVal, { tinh_id: tinhId, ten_diem: tenVal, loai: loaiHt, lat: latVal, long: lngVal });

              var rawTuyen = row[iTuyen];
              var tuyenVal = (rawTuyen !== undefined && rawTuyen !== null && String(rawTuyen).trim() !== '') ? String(rawTuyen).trim().substring(0, 250) : sheetName;
              var tuyenList = tuyenVal.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
              if (tuyenList.length === 0) tuyenList = [sheetName];

              tuyenList.forEach(function(tItem) {
                routeNamesSet.add(tItem);
                rawRoutePoints.push({ tuyen: tItem, ten_diem: tenVal, stt: globalRowCounter, ly_trinh: lyTrinhVal, du_tru: duTruVal, do_cach: doCachVal });
              });
            }
          }

          if (allPointsMap.size === 0) {
            hideLoading();
            showAlert("Không tìm thấy dữ liệu tọa độ hợp lệ trong file Excel. Vui lòng kiểm tra lại cấu trúc file!");
            return;
          }

          showLoading("Đang nạp danh mục điểm hạ tầng vào CSDL...");
          var pointsArray = Array.from(allPointsMap.values());
          for (var i = 0; i < pointsArray.length; i += 500) {
            var chunk = pointsArray.slice(i, i + 500);
            var res = await supabaseClient.from('diem').upsert(chunk, { onConflict: 'tinh_id,ten_diem' });
            if (res.error) throw res.error;
          }

          var dbPointsRes = await supabaseClient.from('diem').select('id, ten_diem').eq('tinh_id', tinhId);
          var pointMap = new Map();
          if (dbPointsRes.data) dbPointsRes.data.forEach(function(p) { pointMap.set(p.ten_diem, p.id); });

          showLoading("Đang nạp danh mục tuyến cáp vào CSDL...");
          var routesArray = Array.from(routeNamesSet).map(function(r) { return { tinh_id: tinhId, ma_tuyen: r, ten_tuyen: 'Tuyến ' + r }; });
          for (var i = 0; i < routesArray.length; i += 500) {
            var chunk = routesArray.slice(i, i + 500);
            var res = await supabaseClient.from('tuyen').upsert(chunk, { onConflict: 'tinh_id,ma_tuyen' });
            if (res.error) throw res.error;
          }

          var dbRoutesRes = await supabaseClient.from('tuyen').select('id, ma_tuyen').eq('tinh_id', tinhId);
          var routeMap = new Map();
          if (dbRoutesRes.data) dbRoutesRes.data.forEach(function(rt) { routeMap.set(rt.ma_tuyen, rt.id); });

          showLoading("Đang liên kết chi tiết tuyến cáp...");
          var chiTietArray = [];
          rawRoutePoints.forEach(function(rp) {
            var rId = routeMap.get(rp.tuyen), pId = pointMap.get(rp.ten_diem);
            if (rId && pId) {
              chiTietArray.push({ tuyen_id: rId, diem_id: pId, stt: rp.stt, ly_trinh: rp.ly_trinh, du_tru: rp.du_tru, do_cach: rp.do_cach });
            }
          });

          for (var i = 0; i < chiTietArray.length; i += 500) {
            var chunk = chiTietArray.slice(i, i + 500);
            var res = await supabaseClient.from('chi_tiet').upsert(chunk, { onConflict: 'tuyen_id,diem_id' });
            if (res.error) throw res.error;
          }

          hideLoading();
          localStorage.removeItem('gis_data_cache_' + provinceCode);
          showAlert("Import file Excel thô thành công toàn bộ dữ liệu!");
          taiDuLieuTuSupabase(true);

        } catch (err) {
          hideLoading();
          showAlert("Lỗi Import: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

    // ==========================================
    // EXPORT DỮ LIỆU TỪ SUPABASE RA EXCEL
    // ==========================================
    async function exportSupabaseToExcelWeb() {
      var provinceCode = document.getElementById('selectProvince').value;
      showLoading("Đang xuất dữ liệu từ Supabase...");

      try {
        var provRes = await supabaseClient.from('tinh').select('id').eq('ma_tinh', provinceCode).single();
        if (provRes.error) throw provRes.error;
        var tinhId = provRes.data.id;

        var { data, error } = await supabaseClient
          .from('chi_tiet')
          .select(`
            stt, ly_trinh, du_tru, do_cach,
            tuyen!inner(ma_tuyen, tinh_id),
            diem!inner(ten_diem, loai, lat, long)
          `)
          .eq('tuyen.tinh_id', tinhId);

        if (error) throw error;
        if (!data || data.length === 0) { hideLoading(); showAlert("Không có dữ liệu."); return; }

        var flatData = data.map(function(item) {
          return {
            "STT": item.stt, "Tên điểm": item.diem.ten_diem, "Loại": item.diem.loai,
            "Lat": item.diem.lat, "Long": item.diem.long, "Tuyến": item.tuyen.ma_tuyen,
            "Lý trình": item.ly_trinh || "", "Dự trữ (m)": item.du_tru || 0, "Đo cách": item.do_cach || ""
          };
        });

        var wb = XLSX.utils.book_new();
        var groups = {};
        flatData.forEach(function(row) {
          if (!groups[row["Tuyến"]]) groups[row["Tuyến"]] = [];
          groups[row["Tuyến"]].push(row);
        });

        Object.keys(groups).forEach(function(t) {
          XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(groups[t]), t.substring(0, 30));
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flatData), "Tong_Hop");

        hideLoading();
        XLSX.writeFile(wb, "Tuyen_Cap_Quang_" + provinceCode + "_Export.xlsx");
        showAlert("Xuất file Excel thành công!");

      } catch (err) {
        hideLoading();
        showAlert("Lỗi Export: " + err.message);
      }
    }

    function getBaseRouteName(t) { return t ? t.toString().trim().replace(/[-_][0-9a-zA-Z.]+$/i, '').trim() : ''; }
    function parseTuyenList(t) { return t ? (Array.isArray(t) ? t : t.toString().split(',').map(function(s){return s.trim();})) : []; }

    function capNhatDanhSachTuyen(dataPoints) {
      var selectTuyen = document.getElementById('selectTuyen');
      var curr = selectTuyen.value;
      selectTuyen.innerHTML = '<option value="ALL">-- Chọn tuyến cần hiển thị --</option>';
      var set = {};
      dataPoints.forEach(function(pt) {
        if (isMangXong(pt)) return;
        parseTuyenList(pt.tuyenList).forEach(function(t) {
          if (t && t.toLowerCase() !== 'tất cả') set[getBaseRouteName(t)] = true;
        });
      });
      Object.keys(set).sort().forEach(function(t) {
        var opt = document.createElement('option'); opt.value = t; opt.textContent = t; selectTuyen.appendChild(opt);
      });
      if (set[curr]) selectTuyen.value = curr;
    }

    function onTuyenChange() { customManualPoints = []; capNhatComboDiemA(); veLaiTuyenAB(); }
    function onDiemAChange() { veLaiTuyenAB(); var pts = getPointsCuaTuyenHienTai(); if (pts.length > 0) map.setView([pts[0].lat, pts[0].lng], 20, { animate: true }); }
    function onCheDoDinhTuyenChange() { veLaiTuyenAB(); }
    function isMangXong(pt) {
      if (!pt) return false;
      var t = (pt.ten || '').toUpperCase(), l = (pt.loai || '').toUpperCase();
      return l.includes('MĂNG XÔNG') || l === 'MX' || l.includes('MANG XONG') || t.includes('MX') || t.includes('MĂNG XÔNG');
    }

    function capNhatComboDiemA() {
      var sel = document.getElementById('selectTuyen').value;
      var combo = document.getElementById('comboDiemA');
      combo.innerHTML = '<option value="DEFAULT">🟢 Trạm TNN (21.593365, 105.839945)</option>';
      if (sel === 'ALL') return;
      globalDataPoints.filter(function(pt) {
        return parseTuyenList(pt.tuyenList).some(function(t) { return getBaseRouteName(t).toLowerCase() === sel.toLowerCase(); });
      }).forEach(function(pt) {
        if (isMangXong(pt)) {
          var opt = document.createElement('option'); opt.value = pt.ten; opt.textContent = "📍 " + pt.ten; combo.appendChild(opt);
        }
      });
    }

    function getPointsCuaTuyenHienTai() {
      var cheDo = document.getElementById('cheDoDinhTuyen').value;
      var sel = document.getElementById('selectTuyen').value;
      if (sel === 'ALL') return [];
      if (cheDo === 'manual') return customManualPoints;

      var pts = globalDataPoints.filter(function(pt) {
        if (isMangXong(pt)) return false;
        return parseTuyenList(pt.tuyenList).some(function(t) { return getBaseRouteName(t).toLowerCase() === sel.toLowerCase(); });
      });
      pts.sort(function(a, b) { return Number(a.stt) - Number(b.stt); });

      var unique = [], seen = {};
      pts.forEach(function(p) {
        var key = Number(p.lat).toFixed(6) + "," + Number(p.lng).toFixed(6);
        if (!seen[key]) { seen[key] = true; unique.push(p); }
      });
      pts = unique;

      if (!pts.some(function(p) { return Math.abs(p.lat - 21.593365) < 0.00001; })) {
        pts.unshift({ ten: "Trạm TNN", lat: 21.593365, lng: 105.839945, lyTrinh: "", tuyenList: [sel], stt: -9999, loai: "Trạm" });
      }

      return document.getElementById('chkNghichHuong').checked ? pts.slice().reverse() : pts;
    }

    function calculateRouteMilestones(pts, sel) {
      if (!pts || pts.length === 0) return [];
      var nodeDistances = [0], totalGeom = 0;
      for (var i = 0; i < pts.length - 1; i++) {
        totalGeom += calculateHaversine(pts[i].lat, pts[i].lng, pts[i+1].lat, pts[i+1].lng);
        nodeDistances.push(totalGeom);
      }
      return pts.map(function(p, i) {
        var m = Math.round(nodeDistances[i]);
        var km = Math.floor(m / 1000), rem = m % 1000;
        return "Km " + km + "+" + (rem < 10 ? "00" + rem : (rem < 100 ? "0" + rem : rem));
      });
    }

    function veLaiTuyenAB() {
      markersLayer.clearLayers(); mxLayer.clearLayers(); polylinesLayer.clearLayers(); lyTrinhLayer.clearLayers();
      var sel = document.getElementById('selectTuyen').value;
      if (sel === 'ALL') return;

      var pts = getPointsCuaTuyenHienTai();
      if (pts.length < 2) return;

      var calculatedLyTrinhs = calculateRouteMilestones(pts, sel);
      var bounds = [];

      pts.forEach(function(pt, idx) {
        var lat = parseFloat(pt.lat), lng = parseFloat(pt.lng);
        if (!isNaN(lat) && !isNaN(lng)) {
          bounds.push([lat, lng]);
          var html = idx === 0 ? '<div class="point-a-marker">A</div>' : (idx === pts.length - 1 ? '<div class="point-b-marker">B</div>' : '<div class="standard-marker"></div>');
          var marker = L.marker([lat, lng], { icon: L.divIcon({ className: '', html: html, iconSize: [30, 30], iconAnchor: [15, 15] }) });
          marker.bindPopup("<b>Tuyến: " + sel + "</b><br>Tên: " + pt.ten + "<br>Lý trình: <b>" + calculatedLyTrinhs[idx] + "</b>");
          markersLayer.addLayer(marker);
        }
      });

      var line = pts.map(function(p) { return [parseFloat(p.lat), parseFloat(p.lng)]; });
      if (line.length > 1) polylinesLayer.addLayer(L.polyline(line, { color: '#0d6efd', weight: 3.5 }));
      if (bounds.length > 0) map.fitBounds(bounds, { padding: [50, 50] });
    }

    function timViTriDut() { showAlert("Chức năng phân tích OTDR đã sẵn sàng."); }
    function xoaTuyenThuCong() { markersLayer.clearLayers(); polylinesLayer.clearLayers(); }
    function calculateHaversine(lat1, lon1, lat2, lon2) {
      var R = 6371000, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
  </script>
