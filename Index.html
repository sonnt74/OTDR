<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ Thống GIS & Định Vị Cố OTDR - Supabase Integration</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  
  <!-- SheetJS để đọc/ghi file Excel trực tiếp trên trình duyệt -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    #control-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      width: 330px;
      max-height: 92vh;
      overflow-y: auto;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }
    
    .panel-header {
      background-color: #0d6efd;
      color: white;
      padding: 10px 12px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .panel-body-content { display: block; transition: opacity 0.3s ease; }
    .collapsed .panel-body-content { display: none; }

    .status-badge {
      background-color: #e8f4fd;
      color: #084298;
      border: 1px solid #b6effb;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group select, .form-group input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 12px;
      box-sizing: border-box;
    }

    .btn-action {
      background-color: #dc3545;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      padding: 11px;
      border-radius: 6px;
      font-size: 12px;
      width: 100%;
      margin-top: 4px;
      box-shadow: 0 2px 4px rgba(220,53,69,0.3);
    }
    .btn-action:hover { background-color: #bb2d3b; }

    .btn-options-main {
      background-color: #495057;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      width: 100%;
      margin-top: 8px;
      box-shadow: 0 2px 4px rgba(73,80,87,0.3);
    }
    .btn-options-main:hover { background-color: #343a40; }

    .btn-chuanhoa { background-color: #6610f2; color: white; border: none; font-weight: bold; padding: 10px; border-radius: 4px; width: 100%; margin-top: 4px; cursor: pointer; }
    .btn-clear { background-color: #dc3545; color: white; border: none; font-weight: bold; padding: 10px; border-radius: 4px; width: 100%; margin-top: 4px; cursor: pointer; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 12px;
      color: #333;
      background: #f8f9fa;
      padding: 6px 8px;
      border-radius: 4px;
    }
    .checkbox-group input { width: auto; }

    #loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 16px;
      flex-direction: column;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0d6efd;
      border-radius: 50%;
      width: 45px; height: 45px;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #optionsModal, #customAlertModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white; width: 90%; max-width: 500px; max-height: 85vh;
      border-radius: 8px; padding: 20px; display: flex; flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 12px;
      font-weight: bold; color: #0d6efd; font-size: 15px;
    }
    .modal-body { overflow-y: auto; flex-grow: 1; font-size: 12px; }
    .gmaps-btn { background: #4285F4; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; margin-top: 6px; font-weight: bold; display: inline-flex; gap: 4px; text-decoration: none; }
    
    .mx-marker { width: 14px; height: 14px; background-color: #198754; border: 2px solid #fff; transform: rotate(45deg); box-shadow: 0 0 6px rgba(0,0,0,0.4); }
    .standard-marker { width: 10px; height: 10px; background-color: #0d6efd; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.4); }
    
    .point-a-marker { background: linear-gradient(135deg, #ffc107, #ff9800); color: #000; font-weight: bold; font-size: 12px; text-align: center; line-height: 28px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 14px rgba(255,193,7,0.9); }
    .point-b-marker { background: linear-gradient(135deg, #dc3545, #b02a37); color: #fff; font-weight: bold; font-size: 12px; text-align: center; line-height: 28px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 14px rgba(220,53,69,0.9); }
    
    .lytrinh-badge { background: #fd7e14; color: white; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; white-space: nowrap; }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-overlay-text">Đang kết nối Supabase...</div>
  </div>

  <div id="map"></div>

  <div id="control-panel">
    <div class="panel-header" onclick="toggleControlPanel()">
      <span>📊 HỆ THỐNG GIS & ĐỊNH VỊ OTDR (SUPABASE)</span>
      <span id="panelToggleIcon" style="margin-left: auto; font-size: 12px;">▲ Thu gọn</span>
    </div>

    <div class="panel-body-content" id="panelBodyContent">
      <div id="statusBadge" class="status-badge"><span>🔄</span> Đang khởi tạo kết nối cơ sở dữ liệu...</div>

      <div class="form-group">
        <label>Chọn Tỉnh / Khu vực quản lý:</label>
        <select id="selectProvince" onchange="onProvinceChange()">
          <option value="TNN">Tỉnh Thái Nguyên (TNN)</option>
        </select>
      </div>

      <div class="form-group">
        <label>1. Chọn mã tuyến cáp (Bắt buộc):</label>
        <select id="selectTuyen" onchange="onTuyenChange()">
          <option value="ALL">-- Chọn tuyến cần hiển thị --</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Nguồn điểm đo (Trạm TNN / MX):</label>
        <select id="comboDiemA" onchange="onDiemAChange()">
          <option value="DEFAULT">🟢 Trạm TNN (21.593365, 105.839945)</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="chkNghichHuong" onchange="onDiemAChange()">
        <label for="chkNghichHuong" style="margin-bottom:0; cursor:pointer;">Đo nghịch hướng (Quay đầu tuyến)</label>
      </div>

      <div class="form-group">
        <label>3. Hệ số chùng cáp (Độ chùng vật lý):</label>
        <input type="number" id="txtDoChung" value="1.075" step="0.001">
      </div>

      <div class="form-group">
        <label>4. Khoảng cách đo OTDR (km):</label>
        <input type="number" id="txtKcOtdr" value="3.5" step="0.1" placeholder="Nhập km từ máy đo...">
      </div>

      <div class="form-group">
        <button class="btn-action" onclick="timViTriDut()">🎯 PHÂN TÍCH & TÌM VỊ TRÍ SỰ CỐ</button>
        <button class="btn-options-main" onclick="document.getElementById('optionsModal').style.display='flex'">⚙️ TÙY CHỌN NÂNG CAO</button>
      </div>
    </div>
  </div>

  <!-- Options Modal -->
  <div id="optionsModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>⚙️ Tùy chọn hệ thống nâng cao</span>
        <button onclick="document.getElementById('optionsModal').style.display='none'" style="background:#dc3545; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">Đóng</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Chế độ định tuyến cáp:</label>
          <select id="cheDoDinhTuyen" onchange="onCheDoDinhTuyenChange()">
            <option value="standard">Bám Tuyến CSHT (Chuẩn STT)</option>
            <option value="road">Bám đường giao thông</option>
            <option value="manual">Tự vẽ thủ công</option>
          </select>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <button class="btn-chuanhoa" onclick="taiDuLieuTuSupabase(true)">🔄 TẢI LẠI DỮ LIỆU SUPABASE</button>
        </div>
        <div class="form-group">
          <button class="btn-chuanhoa" style="background:#198754;" onclick="document.getElementById('excelFileImportInput').click()">📥 IMPORT EXCEL VÀO SUPABASE</button>
          <input type="file" id="excelFileImportInput" accept=".xlsx, .xls" style="display:none;" onchange="importExcelToSupabaseFromWeb(event)">
        </div>
        <div class="form-group">
          <button class="btn-chuanhoa" style="background:#ffc107; color:#000;" onclick="exportSupabaseToExcelWeb()">📤 EXCEL DỮ LIỆU TỪ SUPABASE</button>
        </div>
        <div class="form-group">
          <button class="btn-clear" onclick="xoaTuyenThuCong()">🗑️ LÀM SẠCH BẢN ĐỒ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="customAlertModal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <div class="modal-header" style="justify-content: center; border-bottom: none;"><span id="customAlertTitle">Thông báo</span></div>
      <div class="modal-body" id="customAlertBody" style="padding: 10px 0;"></div>
      <div style="text-align: center; margin-top: 10px;">
        <button onclick="closeCustomAlert()" style="background:#0d6efd; color:white; border:none; padding:8px 20px; border-radius:4px; cursor:pointer; font-weight:bold;">Đã hiểu</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <script>
    // Cấu hình kết nối Supabase
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    var supabaseClient = null;

    var map;
    var markersLayer = L.markerClusterGroup({ maxClusterRadius: 40 });
    var mxLayer = L.layerGroup();
    var polylinesLayer = L.layerGroup();
    var lyTrinhLayer = L.layerGroup();
    var globalDataPoints = [];
    var customManualPoints = [];

    var measureActive = false;
    var measurePoints = [];
    var measureMarkers = [];
    var measurePolyline = null;

    function showAlert(msg, title = "Thông báo") {
      document.getElementById('customAlertTitle').textContent = title;
      document.getElementById('customAlertBody').textContent = msg;
      document.getElementById('customAlertModal').style.display = 'flex';
    }
    function closeCustomAlert() { document.getElementById('customAlertModal').style.display = 'none'; }
    function toggleControlPanel() {
      var panel = document.getElementById('control-panel');
      panel.classList.toggle('collapsed');
      document.getElementById('panelToggleIcon').textContent = panel.classList.contains('collapsed') ? '▼ Mở rộng' : '▲ Thu gọn';
    }

    window.onload = function() {
      var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19 });
      var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 19 });

      map = L.map('map', { center: [21.5942, 105.8481], zoom: 13, maxZoom: 21, layers: [osm] });
      polylinesLayer.addTo(map); 
      markersLayer.addTo(map); 
      mxLayer.addTo(map); 
      lyTrinhLayer.addTo(map);

      L.control.layers(
        { "Bản đồ OSM": osm, "Vệ tinh": sat }, 
        { "Cáp quang": polylinesLayer, "Mốc & Cột": markersLayer, "Măng xông (MX)": mxLayer, "Lý trình": lyTrinhLayer }, 
        { position: 'topright' }
      ).addTo(map);

      var MeasureControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function (map) {
          var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
          var button = L.DomUtil.create('a', '', container);
          button.innerHTML = '📏';
          button.href = '#';
          button.title = 'Bật/Tắt đo khoảng cách';
          button.style.backgroundColor = 'white';
          button.style.width = '30px';
          button.style.height = '30px';
          button.style.lineHeight = '30px';
          button.style.textAlign = 'center';
          button.style.fontSize = '16px';
          button.style.textDecoration = 'none';
          button.style.color = 'black';
          button.style.cursor = 'pointer';

          L.DomEvent.on(button, 'click', function (e) {
            L.DomEvent.stopPropagation(e);
            L.DomEvent.preventDefault(e);
            measureActive = !measureActive;
            if (measureActive) {
              button.style.backgroundColor = '#e0e0e0';
            } else {
              button.style.backgroundColor = 'white';
              clearMeasure();
            }
          });
          return container;
        }
      });
      map.addControl(new MeasureControl());

      map.on('click', function(e) {
        if (measureActive) {
          measurePoints.push(e.latlng);
          var marker = L.circleMarker(e.latlng, { radius: 5, color: '#ff5722', fillColor: '#ff5722', fillOpacity: 1 }).addTo(map);
          measureMarkers.push(marker);

          if (!measurePolyline) {
            measurePolyline = L.polyline(measurePoints, { color: '#ff5722', weight: 3, dashArray: '5, 5' }).addTo(map);
          } else {
            measurePolyline.setLatLngs(measurePoints);
          }

          if (measurePoints.length > 1) {
            var totalDistance = 0;
            for (var i = 0; i < measurePoints.length - 1; i++) {
              totalDistance += measurePoints[i].distanceTo(measurePoints[i + 1]);
            }
            var textDist = totalDistance >= 1000 ? (totalDistance / 1000).toFixed(2) + ' km' : Math.round(totalDistance) + ' m';
            marker.bindTooltip(textDist, { permanent: true, direction: 'top' }).openTooltip();
          }
          return;
        }

        if (document.getElementById('cheDoDinhTuyen').value === 'manual' && document.getElementById('selectTuyen').value !== 'ALL') {
          customManualPoints.push({ ten: "Điểm vẽ " + (customManualPoints.length + 1), lat: e.latlng.lat, lng: e.latlng.lng, lyTrinh: "", tuyenList: [document.getElementById('selectTuyen').value], stt: customManualPoints.length + 1 });
          veLaiTuyenAB();
        }
      });

      // Khởi tạo Supabase và tải dữ liệu
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        taiDuLieuTuSupabase(false);
      } catch (err) {
        showAlert("Lỗi khởi tạo Supabase Client: " + err.message);
      }
    };

    function clearMeasure() {
      measurePoints = [];
      if (measurePolyline) { map.removeLayer(measurePolyline); measurePolyline = null; }
      measureMarkers.forEach(function (m) { map.removeLayer(m); });
      measureMarkers = [];
    }

    function showLoading(text) {
      document.getElementById('loading-overlay-text').textContent = text || "Đang xử lý...";
      document.getElementById('loading-overlay').style.display = 'flex';
    }
    function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

    function parseLyTrinh(str) {
      if (!str) return { meters: null, suffix: "" };
      var s = str.toString().trim();
      var match = s.match(/(?:km\s*)?(\d+)\s*\+\s*(\d+)(.*)/i);
      if (match) {
        var km = parseInt(match[1]) || 0;
        var m = parseInt(match[2]) || 0;
        var suffix = match[3] ? match[3].trim() : "";
        return { meters: km * 1000 + m, suffix: suffix };
      }
      return { meters: null, suffix: "" };
    }

    function onProvinceChange() {
      taiDuLieuTuSupabase(false);
    }

    async function taiDuLieuTuSupabase(forceRefresh = false) {
      var statusBadge = document.getElementById('statusBadge');
      var provinceCode = document.getElementById('selectProvince').value;

      if (!forceRefresh) {
        var cached = localStorage.getItem('gis_data_cache_' + provinceCode);
        if (cached) {
          try {
            globalDataPoints = JSON.parse(cached);
            if (globalDataPoints && globalDataPoints.length > 0) {
              capNhatDanhSachTuyen(globalDataPoints);
              statusBadge.innerHTML = "<span>⚡</span> Đã tải dữ liệu bộ nhớ (" + globalDataPoints.length + " điểm - Tỉnh " + provinceCode + ").";
              return;
            }
          } catch(e) { localStorage.removeItem('gis_data_cache_' + provinceCode); }
        }
      }

      showLoading("Đang tải dữ liệu từ Supabase...");
      statusBadge.innerHTML = "<span>⏳</span> Đang truy vấn cơ sở dữ liệu Supabase...";

      try {
        let { data, error } = await supabaseClient
          .from('route_points')
          .select(`
            stt,
            ly_trinh,
            du_tru,
            do_cach_tnn,
            routes(route_code, province_id, provinces(code)),
            infrastructure_points(point_name, point_type, lat, lng)
          `)
          .eq('routes.provinces.code', provinceCode);

        if (error) throw error;

        if (!data || data.length === 0) {
          hideLoading();
          statusBadge.innerHTML = "<span>⚠️</span> Không có dữ liệu tuyến cáp cho tỉnh " + provinceCode;
          globalDataPoints = [];
          capNhatDanhSachTuyen(globalDataPoints);
          return;
        }

        globalDataPoints = data.map(function(item) {
          var pName = item.infrastructure_points ? item.infrastructure_points.point_name : "Điểm mốc";
          var pType = item.infrastructure_points ? item.infrastructure_points.point_type : "Bể";
          var pLat = item.infrastructure_points ? item.infrastructure_points.lat : 0;
          var pLng = item.infrastructure_points ? item.infrastructure_points.lng : 0;
          var rCode = item.routes ? item.routes.route_code : "Tuyến chung";

          return {
            ten: pName,
            lat: pLat,
            long: pLng,
            loai: pType,
            tuyenList: [rCode],
            lyTrinh: item.ly_trinh || '',
            duTru: parseFloat(item.du_tru) || 0,
            stt: parseFloat(item.stt) || 0,
            doCachTnn: item.do_cach_tnn || ''
          };
        });

        try { localStorage.setItem('gis_data_cache_' + provinceCode, JSON.stringify(globalDataPoints)); } catch(e){}
        capNhatDanhSachTuyen(globalDataPoints);
        hideLoading();
        statusBadge.innerHTML = "<span>✅</span> Đã đồng bộ thành công (" + globalDataPoints.length + " điểm từ Supabase).";

      } catch (err) {
        hideLoading();
        showAlert("Lỗi kết nối Supabase: " + err.message, "Lỗi cơ sở dữ liệu");
        statusBadge.innerHTML = "<span>❌</span> Lỗi kết nối Supabase.";
      }
    }

    // ==========================================
    // CHỨC NĂNG IMPORT EXCEL LÊN SUPABASE (WEB)
    // ==========================================
    async function importExcelToSupabaseFromWeb(event) {
      var file = event.target.files[0];
      if (!file) return;

      var provinceCode = document.getElementById('selectProvince').value;
      var provinceName = provinceCode === 'TNN' ? 'Tỉnh Thái Nguyên' : 'Tỉnh Quản Lý';

      showLoading("Đang đọc tệp Excel và đồng bộ lên Supabase...");

      var reader = new FileReader();
      reader.onload = async function(e) {
        try {
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, { type: 'array' });

          // 1. Upsert tỉnh vào bảng provinces
          var provRes = await supabaseClient.from('provinces').upsert({
            code: provinceCode,
            name: provinceName,
            settings: { default_zoom: 13, center: [21.5942, 105.8481] }
          }, { onConflict: 'code' }).select();

          if (provRes.error) throw provRes.error;
          var provinceId = provRes.data[0].id;

          var globalRowCounter = 0;

          for (var sIdx = 0; sIdx < workbook.SheetNames.length; sIdx++) {
            var sheetName = workbook.SheetNames[sIdx];
            var sheet = workbook.Sheets[sheetName];
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            if (!rows || rows.length < 2) continue;

            var headerRow = rows[0] || [];
            var h = headerRow.map(function(item) { return item ? String(item).trim().toLowerCase() : ''; });

            var iTen = -1, iLat = -1, iLong = -1, iTuyen = -1, iLyTrinh = -1, iDuTru = -1, iDoCach = -1;

            h.forEach(function(head, colIdx) {
              if (head.includes('tên') || head.includes('ten') || head.includes('mã') || head.includes('diem')) { if (iTen === -1) iTen = colIdx; }
              else if (head === 'lat' || head.includes('vĩ') || head.includes('vi_do')) iLat = colIdx;
              else if (head === 'long' || head.includes('lng') || head.includes('kinh') || head.includes('kinh_do')) iLong = colIdx;
              else if (head.includes('tuyen') || head.includes('tuyến') || head.includes('thu_muc') || head.includes('nhom')) iTuyen = colIdx;
              else if (head.includes('lytrinh') || head.includes('lý trình') || head.includes('ly_trinh')) iLyTrinh = colIdx;
              else if (head.includes('du_tru') || head.includes('dự trữ')) iDuTru = colIdx;
              else if (head.includes('do_cach') || head.includes('đo cách')) iDoCach = colIdx;
            });

            if (iTen === -1) iTen = 0;
            if (iLat === -1) iLat = 1;
            if (iLong === -1) iLong = 2;

            var isMx = sheetName.toLowerCase().includes('mang_xong') || sheetName.toLowerCase().includes('mx');
            var defaultType = isMx ? "Măng xông" : (sheetName.toLowerCase().includes('cot') ? "Cột" : "Bể");

            for (var r = 1; r < rows.length; r++) {
              var row = rows[r];
              if (!row) continue;
              var tenVal = (iTen !== -1 && row[iTen] !== undefined && row[iTen] !== null) ? String(row[iTen]).trim() : ("Điểm " + r);
              if (!tenVal) continue;

              var latVal = parseFloat(row[iLat]);
              var lngVal = parseFloat(row[iLong]);
              if (isNaN(latVal) || isNaN(lngVal) || latVal === 0 || lngVal === 0) continue;

              globalRowCounter++;
              var lyTrinhVal = (iLyTrinh !== -1 && row[iLyTrinh] !== undefined) ? String(row[iLyTrinh]).trim() : null;
              var duTruVal = (iDuTru !== -1 && row[iDuTru] !== undefined && !isNaN(row[iDuTru])) ? parseFloat(row[iDuTru]) : 0;
              var doCachVal = (iDoCach !== -1 && row[iDoCach] !== undefined) ? String(row[iDoCach]).trim() : null;

              var loaiHt = defaultType;
              var tLower = tenVal.toLowerCase();
              if (tLower.includes('mốc') || tLower.includes('moc')) loaiHt = "Mốc";
              else if (tLower.includes('mx') || tLower.includes('măng xông')) loaiHt = "Măng xông";

              // 1. Upsert điểm vào infrastructure_points
              var ptUpsert = await supabaseClient.from('infrastructure_points').upsert({
                province_id: provinceId,
                point_name: tenVal,
                point_type: loaiHt,
                lat: latVal,
                lng: lngVal
              }, { onConflict: 'province_id,point_name' }).select();

              if (ptUpsert.error) continue;
              var pointId = ptUpsert.data[0].id;

              // 2. Lấy danh sách tuyến
              var tuyenRaw = (iTuyen !== -1 && row[iTuyen] !== undefined && row[iTuyen] !== null && String(row[iTuyen]).trim() !== '') ? String(row[iTuyen]).trim() : sheetName;
              var tuyenList = tuyenRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
              if (tuyenList.length === 0) tuyenList = [sheetName];

              for (var t = 0; t < tuyenList.length; t++) {
                var tItem = tuyenList[t];

                // Kiểm tra / Tạo tuyến trong routes
                var routeSelect = await supabaseClient.from('routes').select('id').eq('province_id', provinceId).eq('route_code', tItem);
                var routeId;
                if (!routeSelect.data || routeSelect.data.length === 0) {
                  var newRoute = await supabaseClient.from('routes').insert({
                    province_id: provinceId,
                    route_code: tItem,
                    route_name: 'Tuyến ' + tItem
                  }).select();
                  routeId = newRoute.data[0].id;
                } else {
                  routeId = routeSelect.data[0].id;
                }

                // 3. Liên kết vào route_points
                await supabaseClient.from('route_points').upsert({
                  route_id: routeId,
                  point_id: pointId,
                  stt: globalRowCounter,
                  ly_trinh: lyTrinhVal,
                  du_tru: duTruVal,
                  do_cach_tnn: doCachVal
                }, { onConflict: 'route_id,point_id' });
              }
            }
          }

          hideLoading();
          localStorage.removeItem('gis_data_cache_' + provinceCode);
          showAlert("Đã import thành công dữ liệu từ file Excel lên Supabase!");
          taiDuLieuTuSupabase(true);

        } catch (err) {
          hideLoading();
          showAlert("Lỗi khi import file Excel: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = ''; // Reset input file
    }

    // ==========================================
    // CHỨC NĂNG EXPORT DỮ LIỆU TỪ SUPABASE RA EXCEL (WEB)
    // ==========================================
    async function exportSupabaseToExcelWeb() {
      var provinceCode = document.getElementById('selectProvince').value;
      showLoading("Đang trích xuất dữ liệu từ Supabase...");

      try {
        var provRes = await supabaseClient.from('provinces').select('id').eq('code', provinceCode).single();
        if (provRes.error) throw provRes.error;
        var provinceId = provRes.data.id;

        var { data, error } = await supabaseClient
          .from('route_points')
          .select(`
            stt,
            ly_trinh,
            du_tru,
            do_cach_tnn,
            routes!inner(route_code, province_id),
            infrastructure_points!inner(point_name, point_type, lat, lng)
          `)
          .eq('routes.province_id', provinceId);

        if (error) throw error;
        if (!data || data.length === 0) {
          hideLoading();
          showAlert("Không có dữ liệu để xuất file.");
          return;
        }

        var flatData = data.map(function(item) {
          return {
            "STT": item.stt,
            "Tên điểm": item.infrastructure_points.point_name,
            "Loại": item.infrastructure_points.point_type,
            "Lat": item.infrastructure_points.lat,
            "Long": item.infrastructure_points.lng,
            "Tuyến": item.routes.route_code,
            "Lý trình": item.ly_trinh || "",
            "Dự trữ (m)": item.du_tru || 0,
            "Đo cách TNN": item.do_cach_tnn || ""
          };
        });

        var wb = XLSX.utils.book_new();

        // Gom nhóm theo Tuyến để tạo các sheet riêng biệt
        var groups = {};
        flatData.forEach(function(row) {
          var t = row["Tuyến"];
          if (!groups[t]) groups[t] = [];
          groups[t].push(row);
        });

        Object.keys(groups).forEach(function(tKey) {
          var ws = XLSX.utils.json_to_sheet(groups[tKey]);
          var sheetName = tKey.substring(0, 30);
          XLSX.utils.book_append_sheet(wb, ws, sheetName);
        });

        // Sheet tổng hợp toàn bộ
        var wsAll = XLSX.utils.json_to_sheet(flatData);
        XLSX.utils.book_append_sheet(wb, wsAll, "Tong_Hop");

        hideLoading();
        XLSX.writeFile(wb, "Tuyen_Cap_Quang_" + provinceCode + "_Export.xlsx");
        showAlert("Đã xuất tệp Excel thành công!");

      } catch (err) {
        hideLoading();
        showAlert("Lỗi khi xuất dữ liệu: " + err.message);
      }
    }

    function getBaseRouteName(tName) {
      if (!tName) return '';
      return tName.toString().trim().replace(/[-_][0-9a-zA-Z.]+$/i, '').trim();
    }

    function parseTuyenList(tList) {
      if (!tList) return [];
      if (Array.isArray(tList)) return tList;
      return tList.toString().split(',').map(function(s) { return s.trim(); });
    }

    function capNhatDanhSachTuyen(dataPoints) {
      var selectTuyen = document.getElementById('selectTuyen');
      var curr = selectTuyen.value;
      selectTuyen.innerHTML = '<option value="ALL">-- Chọn tuyến cần hiển thị --</option>';
      var set = {};
      dataPoints.forEach(function(pt) {
        if (isMangXong(pt)) return;
        parseTuyenList(pt.tuyenList).forEach(function(t) {
          if (t && t.toLowerCase() !== 'tất cả' && t.toLowerCase() !== 'tuyến chung') {
            set[getBaseRouteName(t)] = true;
          }
        });
      });
      Object.keys(set).sort().forEach(function(t) {
        var opt = document.createElement('option'); opt.value = t; opt.textContent = t;
        selectTuyen.appendChild(opt);
      });
      if (set[curr]) selectTuyen.value = curr;
    }

    function onTuyenChange() { customManualPoints = []; capNhatComboDiemA(); veLaiTuyenAB(); }
    
    function onDiemAChange() {

    function onCheDoDinhTuyenChange() { veLaiTuyenAB(); }

    function isMangXong(pt) {
      if (!pt) return false;
      var t = (pt.ten || '').toUpperCase(), l = (pt.loai || '').toUpperCase();
      return l === 'MĂNG XÔNG' || l === 'MX' || l === 'SC' || t.includes('MX') || t.includes('MĂNG XÔNG');
    }

    function capNhatComboDiemA() {
      var sel = document.getElementById('selectTuyen').value;
      var combo = document.getElementById('comboDiemA');
      combo.innerHTML = '<option value="DEFAULT">🟢 Trạm TNN (21.593365, 105.839945)</option>';
      if (sel === 'ALL') return;
      globalDataPoints.filter(function(pt) {
        return parseTuyenList(pt.tuyenList).some(function(t) { return getBaseRouteName(t).toLowerCase() === sel.toLowerCase(); });
      }).forEach(function(pt) {

    function getPointsCuaTuyenHienTai() {
      var cheDo = document.getElementById('cheDoDinhTuyen').value;
      var sel = document.getElementById('selectTuyen').value;
      if (sel === 'ALL') return [];
      if (cheDo === 'manual') return customManualPoints;

      var pts = globalDataPoints.filter(function(pt) {
        if (isMangXong(pt)) return false;
        return parseTuyenList(pt.tuyenList).some(function(t) { return getBaseRouteName(t).toLowerCase() === sel.toLowerCase(); });
      });
      pts.sort(function(a, b) { return Number(a.stt) - Number(b.stt); });

      var unique = [], seen = {};
      pts.forEach(function(p) {
        var key = Number(p.lat).toFixed(6) + "," + Number(p.lng).toFixed(6);
        if (!seen[key]) { seen[key] = true; unique.push(p); }
      });
      pts = unique;

      if (!pts.some(function(p) { return Math.abs(p.lat - 21.593365) < 0.00001; })) {
        pts.unshift({ ten: "Trạm TNN", lat: 21.593365, lng: 105.839945, lyTrinh: "", tuyenList: [sel], stt: -9999, loai: "Trạm" });
      }

      var selectedA = document.getElementById('comboDiemA').value;
      if (selectedA !== 'DEFAULT') {
        var mxObj = globalDataPoints.find(function(p) {
          return p.ten === selectedA && isMangXong(p) && parseTuyenList(p.tuyenList).some(function(t) { return getBaseRouteName(t).toLowerCase() === sel.toLowerCase(); });
        });
        
        if (mxObj) {
          var closestIdx = 0, minDst = Infinity;
          pts.forEach(function(p, idx) {
            var d = calculateHaversine(mxObj.lat, mxObj.lng, p.lat, p.lng);
            if (d < minDst) { minDst = d; closestIdx = idx; }
          });
          pts = pts.slice(closestIdx);
          pts[0] = { ten: mxObj.ten, lat: mxObj.lat, lng: mxObj.lng, lyTrinh: mxObj.lyTrinh, tuyenList: mxObj.tuyenList, stt: -999, loai: "Măng xông" };
        } else {
          var idx = pts.findIndex(function(p) { return p.ten === selectedA; });
          if (idx >= 0) pts = pts.slice(idx);
        }
      }
      return document.getElementById('chkNghichHuong').checked ? pts.slice().reverse() : pts;
    }

    function calculateRouteMilestones(pts, sel) {
      if (!pts || pts.length === 0) return [];
      var nodeDistances = [0], totalGeom = 0;
      for (var i = 0; i < pts.length - 1; i++) {
        totalGeom += calculateHaversine(pts[i].lat, pts[i].lng, pts[i+1].lat, pts[i+1].lng);
        nodeDistances.push(totalGeom);
      }

      var globalSuffix = "", rawAnchors = [];
      if (sel && sel !== 'ALL') {
        var routeMXs = globalDataPoints.filter(function(pt) {
          if (!isMangXong(pt)) return false;
          return parseTuyenList(pt.tuyenList).some(function(t) { return getBaseRouteName(t).toLowerCase() === sel.toLowerCase(); });
        });
        routeMXs.forEach(function(mx) {
          var pf = parseLyTrinh(mx.lyTrinh);
          if (pf.suffix && !globalSuffix) globalSuffix = pf.suffix;
          if (pf.meters !== null) {
            var geomPos = getDistanceAlongRoute(mx, pts);
            rawAnchors.push({ geom: geomPos, meters: pf.meters, suffix: pf.suffix });
          }
        });
      }

      pts.forEach(function(p, idx) {
        var pf = parseLyTrinh(p.lyTrinh);
        if (pf.suffix && !globalSuffix) globalSuffix = pf.suffix;
        if (pf.meters !== null) {
          rawAnchors.push({ geom: nodeDistances[idx], meters: pf.meters, suffix: pf.suffix });
        }
      });

      rawAnchors.sort(function(a, b) { return a.geom - b.geom; });
      var anchors = [];
      rawAnchors.forEach(function(an) {
        if (anchors.length === 0 || Math.abs(anchors[anchors.length - 1].geom - an.geom) > 1) anchors.push(an);
      });

      var resultMeters = new Array(pts.length), resultSuffixes = new Array(pts.length);
      var isHNI = sel && sel.toUpperCase().indexOf('HNI') !== -1;

      if (anchors.length === 0) {
        for (var i = 0; i < pts.length; i++) {
          resultMeters[i] = nodeDistances[i];
          resultSuffixes[i] = globalSuffix;
        }
      } else {
        for (var i = pts.length - 1; i >= 0; i--) {
          var geom_i = nodeDistances[i];
          var activeAnchor = null;
          for (var a = anchors.length - 1; a >= 0; a--) {
            if (anchors[a].geom >= geom_i - 0.01) { activeAnchor = anchors[a]; } else { break; }
          }
          if (!activeAnchor) activeAnchor = anchors[anchors.length - 1];

          var deltaGeom = activeAnchor.geom - geom_i;
          resultMeters[i] = isHNI ? (activeAnchor.meters + deltaGeom) : (activeAnchor.meters - deltaGeom);
          resultSuffixes[i] = activeAnchor.suffix ? activeAnchor.suffix : globalSuffix;
        }
      }

      return pts.map(function(pt, idx) {
        var pf = parseLyTrinh(pt.lyTrinh);
        if (idx === 0 && (pt.stt === -9999 || !pt.lyTrinh || pf.meters === null)) return "";
        if (pf.meters !== null && pt.lyTrinh) {
          var currentLt = pt.lyTrinh.toString().trim();
          var ptSuffix = pf.suffix ? pf.suffix : resultSuffixes[idx];
          if (ptSuffix && !currentLt.includes(ptSuffix)) currentLt += " " + ptSuffix;
          return currentLt;
        }

        var mVal = Math.max(0, resultMeters[idx]);
        var km = Math.floor(mVal / 1000);
        var m = Math.round(mVal % 1000);
        var segmentSuffix = resultSuffixes[idx] || globalSuffix;

        return "Km " + km + "+" + (m < 10 ? "00" + m : (m < 100 ? "0" + m : m)) + (segmentSuffix ? " " + segmentSuffix : "");
      });
    }

    function interpolateLyTrinhAtDistance(exactPhysDist, pts, calculatedLyTrinhs, sel) {
      var nodeDistances = [0], totalGeom = 0;
      for (var i = 0; i < pts.length - 1; i++) {
        totalGeom += calculateHaversine(pts[i].lat, pts[i].lng, pts[i+1].lat, pts[i+1].lng);
        nodeDistances.push(totalGeom);
      }

      for (var i = 0; i < pts.length - 1; i++) {
        if (exactPhysDist >= nodeDistances[i] && exactPhysDist <= nodeDistances[i+1]) {
          var pf1 = parseLyTrinh(calculatedLyTrinhs[i]);
          var pf2 = parseLyTrinh(calculatedLyTrinhs[i+1]);
          var segLen = nodeDistances[i+1] - nodeDistances[i];
          var r = segLen > 0 ? (exactPhysDist - nodeDistances[i]) / segLen : 0;

          if (pf1.meters !== null && pf2.meters !== null) {
            var exactMeters = pf1.meters + r * (pf2.meters - pf1.meters);
            var km = Math.floor(exactMeters / 1000);
            var m = Math.round(exactMeters % 1000);
            return "Km " + km + "+" + (m < 10 ? "00" + m : (m < 100 ? "0" + m : m)) + (pf1.suffix ? " " + pf1.suffix : "");
          }
        }
      }
      return calculatedLyTrinhs[calculatedLyTrinhs.length - 1] || "Km 0+000";
    }

    function veLaiTuyenAB() {
      markersLayer.clearLayers(); 
      mxLayer.clearLayers(); 
      polylinesLayer.clearLayers(); 
      lyTrinhLayer.clearLayers();
      
      var sel = document.getElementById('selectTuyen').value;
      if (sel === 'ALL') return;

      var pts = getPointsCuaTuyenHienTai();
      if (pts.length < 2) {
        showAlert("Tuyến '" + sel + "' hiện chỉ có " + pts.length + " điểm tọa độ hợp lệ. Cần ít nhất 2 điểm để vẽ tuyến cáp!");
        return;
      }

      var calculatedLyTrinhs = calculateRouteMilestones(pts, sel);
      var bounds = [];
      
      pts.forEach(function(pt, idx) {
        var lat = parseFloat(pt.lat), lng = parseFloat(pt.lng);
        if (!isNaN(lat) && !isNaN(lng)) {
          bounds.push([lat, lng]);
          var html = idx === 0 ? '<div class="point-a-marker">A</div>' : (idx === pts.length - 1 ? '<div class="point-b-marker">B</div>' : '<div class="standard-marker"></div>');
          var marker = L.marker([lat, lng], { icon: L.divIcon({ className: '', html: html, iconSize: [30, 30], iconAnchor: [15, 15] }) });
          
          var ltText = calculatedLyTrinhs[idx];
          var popupRole = idx === 0 ? "<b>🟢 Điểm Đo Nguồn (Điểm A)</b><br>" : (idx === pts.length - 1 ? "<b>🔴 Điểm Cuối Tuyến (Điểm B)</b><br>" : "");
          var popupLtStr = ltText ? ltText : "Không có (Điểm gốc)";
          marker.bindPopup("<b>Tuyến: " + sel + "</b><br>" + popupRole + "Tên: " + pt.ten + "<br>Lý trình: <b>" + popupLtStr + "</b><br><a href='https://www.google.com/maps/search/?api=1&query=" + lat + "," + lng + "' target='_blank' class='gmaps-btn'>🗺️ Google Maps</a>");
          
          markersLayer.addLayer(marker);
          if ((idx === pts.length - 1 || (idx === 0 && ltText)) && ltText) {
            lyTrinhLayer.addLayer(L.marker([lat, lng], { icon: L.divIcon({ className: '', html: '<div class="lytrinh-badge">' + ltText + '</div>', iconSize: [110, 20], iconAnchor: [-10, 10] }), interactive: false }));
          }
        }
      });

      var routeMXs = globalDataPoints.filter(function(pt) {
        if (!isMangXong(pt)) return false;
        return parseTuyenList(pt.tuyenList).some(function(t) { return t.toLowerCase() === 'tất cả' || getBaseRouteName(t).toLowerCase() === sel.toLowerCase(); });
      });

      routeMXs.forEach(function(mx) {
        var lat = parseFloat(mx.lat), lng = parseFloat(mx.lng);
        if (!isNaN(lat) && !isNaN(lng)) {
          bounds.push([lat, lng]);
          var mxMarker = L.marker([lat, lng], { icon: L.divIcon({ className: '', html: '<div class="mx-marker"></div>', iconSize: [30, 30], iconAnchor: [15, 15] }) });
          
          var mxPopup = "<b>" + mx.ten + "</b><br>Tuyến: " + sel + "<br>";
          if (mx.lyTrinh) mxPopup += "Lý trình: <b>" + mx.lyTrinh + "</b><br>";
          if (mx.doCachTnn) mxPopup += "📏 Đo cách TNN: <b>" + mx.doCachTnn + "</b><br>";
          mxPopup += "<a href='https://www.google.com/maps/search/?api=1&query=" + lat + "," + lng + "' target='_blank' class='gmaps-btn'>🗺️ Google Maps</a>";
          
          mxMarker.bindPopup(mxPopup);
          mxLayer.addLayer(mxMarker);
        }
      });

      var line = pts.map(function(p) { return [parseFloat(p.lat), parseFloat(p.lng)]; });
      if (line.length > 1) polylinesLayer.addLayer(L.polyline(line, { color: '#0d6efd', weight: 3.5 }));
      if (bounds.length > 0) map.fitBounds(bounds, { padding: [50, 50] });
    }

    function timViTriDut() {
      var kcOtdr = parseFloat(document.getElementById('txtKcOtdr').value);
      var heSoChung = parseFloat(document.getElementById('txtDoChung').value) || 1.05;
      var sel = document.getElementById('selectTuyen').value;

      if (isNaN(kcOtdr) || kcOtdr <= 0) { showAlert("Vui lòng nhập khoảng cách đo OTDR hợp lệ!"); return; }
      if (sel === 'ALL') { showAlert("Vui lòng chọn tuyến cáp cần phân tích!"); return; }

      var pts = getPointsCuaTuyenHienTai();
      if (pts.length < 2) { showAlert("Tuyến hiện tại không đủ điểm để tính toán nội suy!"); return; }

      var calculatedLyTrinhs = calculateRouteMilestones(pts, sel);
      var targetMeters = kcOtdr * 1000;

      var allRouteMXs = globalDataPoints.filter(function(pt) {
        if (!isMangXong(pt)) return false;
        return parseTuyenList(pt.tuyenList).some(function(t) { return getBaseRouteName(t).toLowerCase() === sel.toLowerCase(); });
      });

      var routeStops = [];
      pts.forEach(function(p) {
        var d = getDistanceAlongRoute(p, pts);
        routeStops.push({ ten: p.ten, lat: p.lat, lng: p.lng, lyTrinh: p.lyTrinh || "", dist: d, duTru: isMangXong(p) ? (parseFloat(p.duTru) || 0) : 0, isMX: isMangXong(p) });
      });

      allRouteMXs.forEach(function(mx) {
        if (!routeStops.some(function(s) { return Math.abs(s.lat - mx.lat) < 0.00001 && Math.abs(s.lng - mx.lng) < 0.00001; })) {
          var d = getDistanceAlongRoute(mx, pts);
          routeStops.push({ ten: mx.ten, lat: mx.lat, lng: mx.lng, lyTrinh: mx.lyTrinh || "", dist: d, duTru: parseFloat(mx.duTru) || 0, isMX: true });
        }
      });

      routeStops.sort(function(a, b) { return a.dist - b.dist; });

      var stopFiberDistances = [0], totalFiber = 0;
      for (var k = 0; k < routeStops.length - 1; k++) {
        var dPhys = routeStops[k+1].dist - routeStops[k].dist;
        var duTruNext = routeStops[k+1].duTru || 0;
        totalFiber += (dPhys * heSoChung) + duTruNext;
        stopFiberDistances.push(totalFiber);
      }

      var targetLat, targetLng, calcLyTrinhStr = "Km 0+000", lastIdx = routeStops.length - 1;

      if (targetMeters >= stopFiberDistances[lastIdx]) {
        targetLat = routeStops[lastIdx].lat;
        targetLng = routeStops[lastIdx].lng;
        calcLyTrinhStr = calculatedLyTrinhs[calculatedLyTrinhs.length - 1];
      } else {
        var segIdx = 0;
        for (var k = 0; k < stopFiberDistances.length - 1; k++) {
          if (targetMeters >= stopFiberDistances[k] && targetMeters <= stopFiberDistances[k+1]) { segIdx = k; break; }
        }

        var s1 = routeStops[segIdx], s2 = routeStops[segIdx+1];
        var fiberStart = stopFiberDistances[segIdx], remFiber = targetMeters - fiberStart;
        var dPhysSeg = s2.dist - s1.dist, fiberPhysPart = dPhysSeg * heSoChung;
        var ratio = remFiber <= fiberPhysPart ? (fiberPhysPart > 0 ? remFiber / fiberPhysPart : 0) : 1.0;

        targetLat = s1.lat + (s2.lat - s1.lat) * ratio;
        targetLng = s1.lng + (s2.lng - s1.lng) * ratio;

        var exactPhysDist = s1.dist + dPhysSeg * ratio;
        calcLyTrinhStr = interpolateLyTrinhAtDistance(exactPhysDist, pts, calculatedLyTrinhs, sel);
      }

      var stopFiberMap = {}, currF = 0;
      for (var k = 0; k < routeStops.length; k++) {
        if (k > 0) {
          var dPhys = routeStops[k].dist - routeStops[k-1].dist;
          currF += (dPhys * heSoChung) + (routeStops[k].duTru || 0);
        }
        stopFiberMap[routeStops[k].ten] = currF;
      }

      var mxCandidates = [];
      routeStops.forEach(function(s) { if (s.isMX) mxCandidates.push({ ten: s.ten, distFromStart: stopFiberMap[s.ten] }); });
      allRouteMXs.forEach(function(m) {
        if (!mxCandidates.some(function(c) { return c.ten === m.ten; })) {
          var d = getDistanceAlongRoute(m, pts), cf = d * heSoChung;
          allRouteMXs.forEach(function(otherM) {
            if (getDistanceAlongRoute(otherM, pts) <= d) cf += (parseFloat(otherM.duTru) || 0);
          });
          mxCandidates.push({ ten: m.ten, distFromStart: cf });
        }
      });
      mxCandidates.sort(function(a, b) { return a.distFromStart - b.distFromStart; });

      var prevMXInfo = "Không xác định", nextMXInfo = "Không xác định";
      var prevMXs = mxCandidates.filter(function(m) { return m.distFromStart <= targetMeters; });
      var nextMXs = mxCandidates.filter(function(m) { return m.distFromStart > targetMeters; });

      if (prevMXs.length > 0) {
        var closestPrev = prevMXs[prevMXs.length - 1];
        prevMXInfo = closestPrev.ten + " (Cách sự cố ~" + Math.round(targetMeters - closestPrev.distFromStart) + "m)";
      }
      if (nextMXs.length > 0) {
        var closestNext = nextMXs[0];
        nextMXInfo = closestNext.ten + " (Cách sự cố ~" + Math.round(closestNext.distFromStart - targetMeters) + "m)";
      }

      map.setView([targetLat, targetLng], 21, { animate: true });
      var faultMarker = L.marker([targetLat, targetLng], { icon: L.divIcon({ className: '', html: '<div style="background:#ff3333; color:white; width:32px; height:32px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; font-weight:bold; box-shadow:0 0 15px rgba(255,0,0,0.9);">⚠️</div>', iconSize: [32, 32], iconAnchor: [16, 16] }) }).addTo(markersLayer);

      var initialPopupHtml = "<b>⚠️ VỊ TRÍ SỰ CỐ (ĐÃ ZOOM CẬN CẢNH)</b><br>" +
                           "Khoảng cách đo OTDR: <b>" + kcOtdr + " km</b><br>" +
                           "🛣️ Lý trình thực tế: <b style='color:#fd7e14;'>" + calcLyTrinhStr + "</b><br>" +
                           "• Măng xông trước: <b>" + prevMXInfo + "</b><br>" +
                           "• Măng xông sau: <b>" + nextMXInfo + "</b><br>" +
                           "📍 Địa chỉ hành chính: <span id='fault-address' style='color:#0d6efd;'>Đang tra cứu...</span><br>" +
                           '<a href="https://www.google.com/maps/search/?api=1&query=' + targetLat + ',' + targetLng + '" target="_blank" class="gmaps-btn">🗺️ Dẫn đường Google Maps</a>';

      faultMarker.bindPopup(initialPopupHtml).openPopup();

      fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + targetLat + '&lon=' + targetLng + '&accept-language=vi')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var addr = (data && data.display_name) ? data.display_name : "Không xác định được địa chỉ hành chính chi tiết";
          faultMarker.setPopupContent(initialPopupHtml.replace("Đang tra cứu...", addr));
        })
        .catch(function(err) {
          faultMarker.setPopupContent(initialPopupHtml.replace("Đang tra cứu...", "Không thể tải địa chỉ hành chính"));
        });
    }

    function xoaTuyenThuCong() {
      customManualPoints = []; 
      markersLayer.clearLayers(); 
      mxLayer.clearLayers();
      polylinesLayer.clearLayers(); 
      lyTrinhLayer.clearLayers();
      document.getElementById('selectTuyen').value = 'ALL';
      showAlert("Đã làm sạch bản đồ.");
    }

    function getDistanceAlongRoute(targetPt, pathPts) {
      if (!pathPts || pathPts.length < 2) return 0;
      var minDst = Infinity, bestDist = 0, currentDist = 0;
      for (var i = 0; i < pathPts.length - 1; i++) {
        var p1 = pathPts[i], p2 = pathPts[i+1];
        var segLen = calculateHaversine(p1.lat, p1.lng, p2.lat, p2.lng);
        if (segLen === 0) continue;
        var dx = p2.lng - p1.lng, dy = p2.lat - p1.lat;
        var lenSq = dx * dx + dy * dy;
        var t = lenSq === 0 ? 0 : ((targetPt.lng - p1.lng) * dx + (targetPt.lat - p1.lat) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));
        var distToProj = calculateHaversine(targetPt.lat, targetPt.lng, p1.lat + t * dy, p1.lng + t * dx);
        if (distToProj < minDst) { minDst = distToProj; bestDist = currentDist + t * segLen; }
        currentDist += segLen;
      }
      return bestDist;
    }

    function calculateHaversine(lat1, lon1, lat2, lon2) {
      var R = 6371000;
      var dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
  </script>
