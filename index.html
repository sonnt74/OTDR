<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Script Import D? Li?u Lên Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial; padding: 20px;">
  <h2>Công c? N?p D? Li?u Excel lên Supabase 3NF</h2>
  <button onclick="thucHienImport()" style="padding: 10px 20px; background: #198754; color: white; font-weight: bold; border: none; cursor: pointer;">B?t d?u n?p d? li?u t? t?p Tuyen_cap_quang_TNN_Net1.xlsx</button>
  <div id="log" style="margin-top: 20px; white-space: pre-wrap; background: #f8f9fa; padding: 10px; border: 1px solid #ccc;"></div>

  <script>
    const SUPABASE_URL = 'https://lmxbzjislncqkwmcnlgy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_nRRO1mpzjiCLRI57LihWyQ_DZhWZ9HK';<!DOCTYPE html>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function log(msg) {
      document.getElementById('log').textContent += msg + "\n";
    }

    async function thucHienImport() {
      log("Ðang t?i t?p Excel...");
      try {
        var response = await fetch('Tuyen_cap_quang_TNN_Net1.xlsx');
        var buffer = await response.arrayBuffer();
        var workbook = XLSX.read(buffer, { type: 'array' });
        var allEntries = [];
        var globalRowCounter = 0;

        // Quét d? li?u Be_Moc / Cot
        workbook.SheetNames.forEach(function(sName) {
          var sLower = sName.toLowerCase();
          var defaultType = (sLower.includes('cot') || sLower.includes('c?t')) ? "C?t" : "B?";
          var sheet = workbook.Sheets[sName];
          var rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
          if (rows.length < 2) return;

          var h = rows[0].map(function(item) { return item ? item.toString().trim().toLowerCase() : ''; });
          var iTen = 0, iLat = 1, iLong = 2, iHuong = -1, iTuyen = -1, iLyTrinh = -1, iDuTru = -1;

          h.forEach(function(head, col) {
            if (head.includes('tên') || head.includes('ten')) iTen = col;
            else if (head === 'lat' || head.includes('vi')) iLat = col;
            else if (head === 'long' || head.includes('lng') || head.includes('kinh')) iLong = col;
            else if (head.includes('tuyen') || head.includes('tuy?n')) iTuyen = col;
            else if (head.includes('lytrinh') || head.includes('lý trình')) iLyTrinh = col;
            else if (head.includes('du_tru') || head.includes('d? tr?')) iDuTru = col;
          });

          for (var r = 1; r < rows.length; r++) {
            var row = rows[r];
            var tenVal = row[iTen] ? row[iTen].toString().trim() : "";
            if (!tenVal) continue;
            var lat = parseFloat(row[iLat]), lng = parseFloat(row[iLong]);
            if (isNaN(lat) || isNaN(lng)) continue;

            globalRowCounter++;
            var tuyenCapRaw = (iTuyen !== -1 && row[iTuyen]) ? row[iTuyen].toString().trim() : 'Tuy?n Chung';
            var lyTrinh = (iLyTrinh !== -1 && row[iLyTrinh]) ? row[iLyTrinh].toString().trim() : '';
            var duTru = (iDuTru !== -1 && !isNaN(row[iDuTru])) ? parseFloat(row[iDuTru]) : 0;

            tuyenCapRaw.split(',').forEach(function(rawPart) {
              rawPart = rawPart.trim();
              if (!rawPart) return;
              var matchFull = rawPart.match(/^(B? cáp|B?|C?t|M?c|Moc|Be|Cot)\s+(.+?)\s*-\s*([\d\.]+)/i);
              var tenTuyen = matchFull ? matchFull[2].trim() : rawPart;
              var stt = matchFull ? parseFloat(matchFull[3]) : globalRowCounter;

              allEntries.push({
                ten: tenVal, lat: lat, long: lng,
                tuyenList: [tenTuyen || "Tuy?n Chung"],
                loai: defaultType, lyTrinh: lyTrinh, duTru: duTru, stt: !isNaN(stt) ? stt : globalRowCounter
              });
            });
          }
        });

        log("Ðã quét xong " + allEntries.length + " b?n ghi. Ðang d?y lên Supabase...");

        // Ð?ng b? Phân c?p Ðài LSN - Tr?m TNN
        await supabaseClient.from('dai_vt').upsert({ ma_dai: 'LSN', ten_dai: 'Ðài Vi?n thông L?ng Son' }, { onConflict: 'ma_dai' });
        var dbDai = await supabaseClient.from('dai_vt').select('id').eq('ma_dai', 'LSN').single();
        var daiId = dbDai.data.id;

        await supabaseClient.from('tram_vt').upsert({ dai_vt_id: daiId, ma_tram: 'TNN', ten_tram: 'Tr?m Vi?n thông Thái Nguyên' }, { onConflict: 'ma_tram' });
        
        await supabaseClient.from('tinh').upsert({ dai_vt_id: daiId, ma_tinh: 'TNN', ten_tinh: 'T?nh Thái Nguyên' }, { onConflict: 'ma_tinh' });
        var dbTinh = await supabaseClient.from('tinh').select('id').eq('ma_tinh', 'TNN').single();
        var tinhId = dbTinh.data.id;

        // Ð?ng b? Tuy?n cáp
        var routeMap = new Map();
        allEntries.forEach(function(pt) {
          pt.tuyenList.forEach(function(t) {
            if (t && t.toLowerCase() !== 't?t c?') routeMap.set(t, { tinh_id: tinhId, ma_tuyen: t, ten_tuyen: "Tuy?n " + t });
          });
        });
        await supabaseClient.from('tuyen_cap').upsert(Array.from(routeMap.values()), { onConflict: 'tinh_id,ma_tuyen' });
        var dbRoutes = await supabaseClient.from('tuyen_cap').select('id, ma_tuyen').eq('tinh_id', tinhId);
        var routeIdMap = new Map();
        dbRoutes.data.forEach(function(rt) { routeIdMap.set(rt.ma_tuyen, rt.id); });

        // Ð?ng b? Ði?m h? t?ng g?c
        var pointsMap = new Map();
        allEntries.forEach(function(pt) {
          pointsMap.set(pt.ten, { tinh_id: tinhId, ten_diem: pt.ten, loai: pt.loai, lat: pt.lat, long: pt.lng });
        });
        await supabaseClient.from('diem_ha_tang').upsert(Array.from(pointsMap.values()), { onConflict: 'tinh_id,ten_diem' });
        var dbPoints = await supabaseClient.from('diem_ha_tang').select('id, ten_diem').eq('tinh_id', tinhId);
        var pointIdMap = new Map();
        dbPoints.data.forEach(function(p) { pointIdMap.set(p.ten_diem, p.id); });

        // Ð?ng b? Chi ti?t tuy?n
        var detailsArr = [];
        allEntries.forEach(function(pt) {
          var pId = pointIdMap.get(pt.ten);
          if (!pId) return;
          pt.tuyenList.forEach(function(t) {
            var rId = routeIdMap.get(t);
            if (rId) {
              detailsArr.push({ tuyen_id: rId, diem_id: pId, stt: pt.stt, ly_trinh: pt.lyTrinh, du_tru: pt.duTru });
            }
          });
        });

        for (var i = 0; i < detailsArr.length; i += 500) {
          await supabaseClient.from('tuyen_chi_tiet').upsert(detailsArr.slice(i, i + 500), { onConflict: 'tuyen_id,diem_id' });
        }

        log("HOÀN T?T IMPORT D? LI?U LÊN SUPABASE!");
      } catch (err) {
        log("L?i: " + err.message);
      }
    }
  </script>
</body>
</html>
