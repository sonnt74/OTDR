<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hệ Thống Quản Lý GIS & OTDR</title>
  
  <!-- Thư viện Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ========================================================
       1. CÀI ĐẶT CHUNG VÀ TÔNG MÀU BOOTSTRAP
       ======================================================== */
    :root {
      --primary-blue: #0d6efd;
      --light-blue: #e7f1ff;
      --bg-color: #f8f9fa;
      --text-color: #212529;
    }
    
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 0; overflow: hidden; color: var(--text-color); }
    
    /* Bản đồ hiển thị toàn màn hình */
    #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Nút bấm chung */
    button { cursor: pointer; border-radius: 6px; font-weight: bold; border: none; padding: 8px 12px; transition: 0.2s; }
    .btn-primary { background-color: var(--primary-blue); color: white; }
    .btn-primary:hover { background-color: #0b5ed7; }
    .btn-success { background-color: #198754; color: white; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-small { padding: 4px 8px; font-size: 12px; }
    .form-control { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 6px; }

    /* ========================================================
       2. BẢNG ĐIỀU KHIỂN - NGĂN KÉO ĐIỆN THOẠI & PC
       ======================================================== */
    #control-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
      padding: 15px;
      z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 85vh;
      overflow-y: auto;
    }

    #control-panel.collapsed { transform: translateY(calc(100% - 30px)); }
    
    .drawer-handle {
      width: 50px;
      height: 6px;
      background-color: #dee2e6;
      border-radius: 10px;
      margin: 0 auto 15px auto;
      cursor: pointer;
    }

    /* Giao diện Bảng điều khiển trên Máy tính */
    @media (min-width: 768px) {
      #control-panel {
        bottom: auto; top: 15px; left: 15px;
        width: 340px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        max-height: 90vh;
      }
      #control-panel.collapsed { transform: translateX(calc(-100% - 15px)); }
      .drawer-handle { display: none; } /* Ẩn tay cầm ngăn kéo trên PC */
    }

    .panel-section { background: var(--bg-color); border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .panel-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--primary-blue); border-bottom: 1px solid #dee2e6; padding-bottom: 5px; }

    /* ========================================================
       3. BẢNG QUẢN TRỊ & MODAL (HỖ TRỢ CUỘN NGANG MOBILE)
       ======================================================== */
    .app-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6); z-index: 2000;
      align-items: center; justify-content: center;
    }
    
    .modal-content {
      background: white; width: 95%; max-width: 900px; max-height: 90vh;
      border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    }
    
    .modal-header { padding: 15px; background: var(--primary-blue); color: white; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; color: white; font-size: 24px; border: none; cursor: pointer; padding: 0 10px; }
    .modal-body { padding: 15px; overflow-y: auto; }
    
    /* Box quản trị nhỏ (form nhập liệu) */
    .modal-sm { max-width: 400px; }

    /* Tabs giao diện */
    .admin-tabs { display: flex; overflow-x: auto; background: #f8f9fa; border-bottom: 2px solid #dee2e6; }
    .tab-btn { flex: 1; min-width: 100px; background: none; border: none; padding: 10px; color: #495057; font-weight: bold; border-bottom: 3px solid transparent; border-radius: 0; }
    .tab-btn.active { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); }
    .tab-pane { display: none; padding-top: 15px; }
    .tab-pane.active { display: block; }

    /* Thanh cuộn ngang cho bảng */
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 6px; border: 1px solid #dee2e6; }
    table { width: 100%; min-width: 600px; border-collapse: collapse; }
    th { background-color: var(--light-blue); color: var(--primary-blue); padding: 10px; position: sticky; top: 0; border-bottom: 2px solid #dee2e6; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #dee2e6; }
    tr:hover { background-color: #f8f9fa; }
  </style>
</head>
<body>

  <!-- BẢN ĐỒ -->
  <div id="map"></div>

  <!-- BẢNG ĐIỀU KHIỂN (CONTROL PANEL) -->
  <div id="control-panel" class="collapsed">
    <!-- Tay cầm ngăn kéo trên thiết bị di động -->
    <div class="drawer-handle" onclick="toggleGISPanel()"></div>
    
    <!-- Hiển thị tài khoản đang đăng nhập -->
    <div id="userInfoDisplay" style="margin-bottom: 10px; text-align: center;"></div>

    <!-- Khu vực nút công cụ nhanh -->
    <div style="display: flex; gap: 5px; margin-bottom: 15px;">
      <button id="adminMobileBtn" onclick="openModal('adminMasterModal', 'tab-doan')" class="btn-primary" style="flex:1; display:none;">⚙️ Quản trị</button>
      <button onclick="xoaTatCaDoiTuongMap()" class="btn-danger">🧹 Dọn Bản Đồ</button>
      <button onclick="handleLogout()" class="btn-danger" style="background: #6c757d;">🚪 Thoát</button>
    </div>

    <!-- Lọc danh mục -->
    <div class="panel-section form-group">
      <div class="panel-title">🔎 BỘ LỌC DỮ LIỆU</div>
      <label>Đài Viễn Thông:</label>
      <select id="selectDai" class="form-control" onchange="onDaiChange()"><option value="ALL">-- Tất cả Đài --</option></select>
      
      <label>Trạm Viễn Thông:</label>
      <select id="selectTram" class="form-control" onchange="onTramChange()"><option value="ALL">-- Tất cả Trạm --</option></select>
      
      <label>Tuyến Cáp:</label>
      <select id="selectTuyen" class="form-control" onchange="onTuyenChange()"><option value="ALL">-- Chọn tuyến cáp --</option></select>
      
      <label>Đoạn Cáp:</label>
      <select id="selectDoanCap" class="form-control" onchange="onDoanCapChange()"><option value="ALL">-- Tất cả đoạn cáp --</option></select>
    </div>

    <!-- Công cụ Đo OTDR -->
    <div class="panel-section form-group">
      <div class="panel-title">⚡ ĐO ĐỨT OTDR</div>
      <label>Từ điểm đo:</label>
      <select id="comboDiemA" class="form-control" onchange="onDiemAChange()"><option value="DEFAULT">📍 Trạm Gốc (TNN)</option></select>
      <label>Khoảng cách đo (km):</label>
      <input type="number" id="txtKcOtdr" class="form-control" placeholder="Ví dụ: 3.5">
      <button class="btn-danger" style="width: 100%;" onclick="timViTriDut()">🎯 TÌM VỊ TRÍ ĐỨT</button>
    </div>

    <!-- Công cụ Tìm Lý Trình -->
    <div class="panel-section form-group">
      <div class="panel-title">📍 TÌM LÝ TRÌNH</div>
      <input type="text" id="txtTimLyTrinh" class="form-control" placeholder="Ví dụ: 54+100">
      <button class="btn-primary" style="width: 100%;" onclick="timLyTrinhBanDo()">🔍 TÌM KIẾM CỘT/MỐC</button>
    </div>
  </div>


  <!-- ========================================================
       DANH SÁCH MODAL (CỬA SỔ NỔI)
       ======================================================== -->

  <!-- 1. MODAL ĐĂNG NHẬP -->
  <div id="loginModal" class="app-modal" style="display: flex;">
    <div class="modal-content modal-sm">
      <div class="modal-header" style="justify-content: center;">ĐĂNG NHẬP HỆ THỐNG</div>
      <div class="modal-body">
        <input type="text" id="loginEmail" class="form-control" placeholder="Tên đăng nhập hoặc Email">
        <input type="password" id="loginPass" class="form-control" placeholder="Mật khẩu">
        <label style="display:flex; align-items:center; gap:5px; margin-bottom:15px; font-size:14px;">
          <input type="checkbox" id="chkRememberMe"> Ghi nhớ đăng nhập
        </label>
        <button class="btn-primary" style="width: 100%; padding: 10px; font-size: 16px;" onclick="handleCustomLogin()">ĐĂNG NHẬP</button>
      </div>
    </div>
  </div>

  <!-- 2. MODAL QUẢN TRỊ TỔNG (ADMIN) -->
  <div id="adminMasterModal" class="app-modal">
    <div class="modal-content" style="height: 90vh;">
      <div class="modal-header">
        <span>⚙️ BẢNG QUẢN TRỊ DỮ LIỆU</span>
        <button class="close-btn" onclick="closeModals()">×</button>
      </div>
      
      <!-- Tabs Chuyển Bảng -->
      <div class="admin-tabs">
        <button class="tab-btn" onclick="switchAdminTab('tab-doan')">Đoạn Cáp</button>
        <button class="tab-btn" onclick="switchAdminTab('tab-tuyen')">Tuyến Cáp</button>
        <button class="tab-btn" onclick="switchAdminTab('tab-tram')">Trạm VT</button>
        <button class="tab-btn" onclick="switchAdminTab('tab-dai')">Đài VT</button>
        <button class="tab-btn" onclick="switchAdminTab('tab-accounts')">Tài khoản</button>
      </div>

      <div class="modal-body" style="flex: 1; overflow-y: auto;">
        
        <!-- Bảng Đoạn Cáp -->
        <div id="tab-doan" class="tab-pane active">
          <button class="btn-primary" style="margin-bottom:10px;" onclick="moFormThemDoan('')">➕ Thêm Đoạn Cáp</button>
          <div class="table-responsive">
            <table>
              <thead><tr><th>ID</th><th>Mã Đoạn</th><th>Tuyến</th><th>Trạm</th><th>Thao tác</th></tr></thead>
              <tbody id="masterDoanTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Bảng Tuyến Cáp -->
        <div id="tab-tuyen" class="tab-pane">
          <button class="btn-primary" style="margin-bottom:10px;" onclick="moFormThemTuyen('')">➕ Thêm Tuyến Cáp</button>
          <div class="table-responsive">
            <table>
              <thead><tr><th>ID</th><th>Mã Tuyến</th><th>Tên Tuyến</th><th>Thao tác</th></tr></thead>
              <tbody id="masterTuyenTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Bảng Trạm VT -->
        <div id="tab-tram" class="tab-pane">
          <button class="btn-primary" style="margin-bottom:10px;" onclick="moFormThemTram('')">➕ Thêm Trạm VT</button>
          <div class="table-responsive">
            <table>
              <thead><tr><th>ID</th><th>Tên Trạm</th><th>Thuộc Đài</th><th>Thao tác</th></tr></thead>
              <tbody id="masterTramTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Bảng Đài VT -->
        <div id="tab-dai" class="tab-pane">
          <button class="btn-primary" style="margin-bottom:10px;" onclick="moFormThemDai('')">➕ Thêm Đài VT</button>
          <div class="table-responsive">
            <table>
              <thead><tr><th>ID</th><th>Tên Đài</th><th>Thao tác</th></tr></thead>
              <tbody id="masterDaiTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Bảng Tài Khoản -->
        <div id="tab-accounts" class="tab-pane">
          <button class="btn-primary" style="margin-bottom:10px;" onclick="chuanBiFormThemThanhVien('')">➕ Thêm Tài Khoản</button>
          <div class="table-responsive">
            <table>
              <thead><tr><th>Tài Khoản</th><th>Quyền</th><th>Đài</th><th>Trạm</th><th>Sửa Bản Đồ</th><th>Thao tác</th></tr></thead>
              <tbody id="masterAccountTableBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 3. MODAL THÊM / SỬA DANH MỤC (AUX FORM) -->
  <div id="genericAuxModal" class="app-modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <span id="auxModalTitle">➕ Cập Nhật Danh Mục</span>
      </div>
      <div class="modal-body">
        <input type="hidden" id="auxTableType">
        <input type="hidden" id="auxRecordId">
        
        <!-- Khung chứa động mã HTML nhập liệu do admin.js chèn vào -->
        <div id="auxFormFields"></div> 

        <div style="display:flex; gap:10px; margin-top:10px;">
          <button class="btn-success" style="flex:1;" onclick="saveAuxRecord()">Lưu Lại</button>
          <!-- Nút hủy sử dụng hàm closeGenericAuxModal để chỉ đóng form con -->
          <button class="btn-danger" style="flex:1;" onclick="closeGenericAuxModal()">Hủy Bỏ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. MODAL THÊM / SỬA TÀI KHOẢN -->
  <div id="addMemberModal" class="app-modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <span id="accountModalTitle">👥 Cập Nhật Tài Khoản</span>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editingAccountId">
        <label>Tài khoản / Email:</label>
        <input type="text" id="newMemberAccount" class="form-control">
        <label>Mật khẩu (Nhập để đổi):</label>
        <input type="text" id="newMemberPass" class="form-control">
        
        <label>Phân quyền:</label>
        <select id="newMemberRole" class="form-control">
          <option value="nhan_vien">Nhân viên (Chỉ xem)</option>
          <option value="tram_admin">Quản lý Trạm</option>
          <option value="dai_admin">Quản lý Đài</option>
          <option value="sys_admin">Quản trị Hệ thống</option>
        </select>
        
        <label>Đài quản lý:</label>
        <select id="newMemberDai" class="form-control"></select>
        
        <label>Trạm quản lý:</label>
        <select id="newMemberTram" class="form-control"></select>
        
        <label style="display:flex; align-items:center; gap:5px; margin-bottom:15px; font-weight:bold;">
          <input type="checkbox" id="newMemberCanEdit"> Cho phép vẽ bản đồ
        </label>

        <div style="display:flex; gap:10px;">
          <button class="btn-success" style="flex:1;" onclick="saveAccountAction()">Lưu Lại</button>
          <button class="btn-danger" style="flex:1;" onclick="closeAddMemberModal()">Hủy Bỏ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. MODAL CẬP NHẬT ĐIỂM HẠ TẦNG TRÊN BẢN ĐỒ -->
  <div id="crudModal" class="app-modal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <span id="crudTitle">✏️ Cập Nhật Điểm</span>
      </div>
      <div class="modal-body">
        <input type="hidden" id="crudActionType">
        <input type="hidden" id="crudObjectId">
        <label>Tên Điểm:</label><input type="text" id="crudObjectName" class="form-control">
        <label>Lý Trình:</label><input type="text" id="crudObjectLyTrinh" class="form-control">
        <label>Loại Điểm:</label><select id="crudObjectLoai" class="form-control"></select>
        <label>Vĩ Độ (Lat):</label><input type="text" id="crudObjectLat" class="form-control">
        <label>Kinh Độ (Lng):</label><input type="text" id="crudObjectLng" class="form-control">
        <div style="display:flex; gap:10px;">
          <button class="btn-success" style="flex:1;" onclick="executeCrudAction()">Lưu Lại</button>
          <button class="btn-danger" style="flex:1;" onclick="document.getElementById('crudModal').style.display='none'">Hủy Bỏ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 6. MODAL XÁC NHẬN (CONFIRM) -->
  <div id="customConfirmModal" class="app-modal">
    <div class="modal-content modal-sm">
      <div class="modal-header"><span id="confirmModalTitle">Xác nhận</span></div>
      <div class="modal-body">
        <p id="confirmModalMessage"></p>
        <div style="display:flex; gap:10px;">
          <button class="btn-success" style="flex:1;" onclick="resolveConfirm(true)">Đồng Ý</button>
          <button class="btn-danger" style="flex:1;" onclick="resolveConfirm(false)">Hủy</button>
        </div>
      </div>
    </div>
  </div>


 <!-- TẢI CÁC SCRIPT THEO ĐÚNG THỨ TỰ HỆ THỐNG -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="auth.js"></script>
  <script src="idb-helper.js"></script>
  <script src="data.js"></script>
  <script src="map.js"></script>
  <script src="admin.js"></script>

</body>
</html>
