<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ Thống GIS & Định Vị Cáp OTDR - TNN NET1</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* 1. Reset & Khung làm việc */
    html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; font-family: Arial, sans-serif; overflow: hidden; display: flex; flex-direction: row; }
    
    /* 2. Menu Bar bên trái */
    #sidebar-menu { width: 70px; height: 100vh; background-color: #212529; color: white; display: none; flex-direction: column; align-items: center; padding-top: 15px; z-index: 3000; flex-shrink: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
    .menu-item { width: 50px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; margin-bottom: 12px; color: #adb5bd; cursor: pointer; font-size: 10px; transition: all 0.2s; }
    .menu-item:hover, .menu-item.active { background-color: #0d6efd; color: white; }
    .menu-item span.icon { font-size: 20px; margin-bottom: 2px; }

    /* 3. Vùng Bản đồ & Bảng điều khiển */
    #workspace { flex: 1; position: relative; width: 100vw; height: 100vh; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #control-panel { position: absolute; top: 15px; left: 15px; z-index: 2000; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 310px; display: none; max-height: 90vh; overflow-y: auto; }
    .panel-header { background-color: #0d6efd; color: white; padding: 8px 10px; font-weight: bold; font-size: 13px; border-radius: 5px; margin-bottom: 8px; text-align: center; }
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 3px; color: #333; text-transform: uppercase; }
    .form-group select, .form-group input { width: 100%; padding: 6px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 11px; box-sizing: border-box; }
    .form-group select:disabled, .form-group input:disabled { background-color: #e9ecef; cursor: not-allowed; }
    
    .btn-action { background-color: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; padding: 9px; border-radius: 5px; font-size: 11px; width: 100%; margin-top: 2px; }
    .btn-action:hover { opacity: 0.9; }
    .btn-success { background-color: #198754; }
    .btn-warning { background-color: #ffc107; color: #000; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 8px; background: #f8f9fa; padding: 6px; border-radius: 4px; }

    /* 4. Modals (Hộp thoại nổi) */
    .app-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 99999; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 90%; max-width: 400px; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.4); max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; color: #0d6efd; font-size: 15px; }
    
    /* 5. Các thành phần nhỏ trên Map */
    .gmaps-btn { background: #4285F4; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; margin-top: 6px; font-weight: bold; display: inline-flex; text-decoration: none; }
    .mx-marker { width: 16px; height: 16px; background-color: #198754; border: 2px solid #fff; transform: rotate(45deg); box-shadow: 0 0 6px rgba(0,0,0,0.4); }
    .btn-small { background: #0d6efd; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; margin-right: 4px; }
    .btn-small.del { background: #dc3545; }

    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar-menu { width: 100vw; height: 55px; flex-direction: row; justify-content: space-around; padding-top: 0; }
      #workspace { height: calc(100vh - 55px); }
      #control-panel { width: 90%; left: 5%; top: 10px; }
    }
  </style>
</head>
<body>

  <!-- ================= MENU BAR ================= -->
  <div id="sidebar-menu">
    <div class="menu-item active" onclick="toggleGISPanel()" title="Ẩn/Hiện Bảng Điều Khiển"><span class="icon">🗺️</span><span>GIS</span></div>
    <div class="menu-item" onclick="openModal('configModal')" title="Cài đặt hệ thống"><span class="icon">⚙️</span><span>Cài đặt</span></div>
    <div class="menu-item" onclick="handleLogout()" title="Đăng xuất" style="margin-top: auto;"><span class="icon">🚪</span><span>Thoát</span></div>
  </div>

  <!-- ================= WORKSPACE (BẢN ĐỒ + BẢNG ĐIỀU KHIỂN) ================= -->
  <div id="workspace">
    <div id="map"></div>

    <div id="control-panel">
      <div class="panel-header"><span>🗺️ ĐIỀU KHIỂN & PHÂN TÍCH OTDR</span></div>
      
      <!-- Combobox Liên hoàn -->
      <div class="form-group"><label>1. Chọn Đài VT:</label><select id="selectDai" onchange="onDaiChange()"><option value="ALL">-- Tất cả --</option></select></div>
      <div class="form-group"><label>2. Chọn Trạm VT:</label><select id="selectTram" onchange="onTramChange()"><option value="ALL">-- Tất cả --</option></select></div>
      <div class="form-group"><label>3. Chọn Tuyến Cáp:</label><select id="selectTuyen" onchange="onTuyenChange()"><option value="ALL">-- Chọn tuyến --</option></select></div>
      <div class="form-group"><label>4. Chọn Đoạn Cáp:</label><select id="selectDoanCap" onchange="onDoanCapChange()"><option value="ALL">-- Tất cả đoạn --</option></select></div>
      
      <!-- Thông số OTDR -->
      <div class="form-group"><label>5. Nguồn điểm đo:</label><select id="comboDiemA" onchange="onDiemAChange()"><option value="DEFAULT">📍 Trạm TNN</option></select></div>
      <div class="checkbox-group"><input type="checkbox" id="chkNghichHuong" onchange="onDiemAChange()"><label style="margin:0;cursor:pointer;" for="chkNghichHuong">Đo ngược hướng</label></div>
      <div class="form-group"><label>6. Cự ly đo OTDR (km):</label><input type="number" id="txtKcOtdr" value="3.5" step="0.1"></div>
      <div class="form-group"><button class="btn-action" onclick="timViTriDut()">🔍 TÌM VỊ TRÍ ĐỨT</button></div>
      
      <!-- Tìm Lý Trình -->
      <div class="form-group" style="border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 8px;">
        <label>7. Tìm nhanh Lý trình (QL):</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="txtTimLyTrinh" placeholder="VD: 54+100">
          <button class="btn-action btn-success" style="width: auto; padding: 5px 12px; margin:0;" onclick="timLyTrinhBanDo()">🔍</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= CÁC MODAL HỆ THỐNG ================= -->

  <!-- Modal Đăng nhập -->
  <div id="loginModal" class="app-modal" style="display: flex;">
    <div class="modal-content">
      <div class="modal-header"><span>👤 Đăng nhập Hệ Thống</span></div>
      <div class="modal-body">
        <div class="form-group"><label>Email:</label><input type="email" id="loginEmail" placeholder="nhanvien@vnpt.vn"></div>
        <div class="form-group"><label>Mật khẩu:</label><input type="password" id="loginPass" placeholder="••••••••"></div>
        <div class="form-group" style="margin-top: 15px;"><button class="btn-action" style="background:#0d6efd;" onclick="handleSupabaseLogin()">ĐĂNG NHẬP</button></div>
        <div style="text-align: center; margin-top: 10px;"><small id="loginStatus" style="color: #6c757d;"></small></div>
      </div>
    </div>
  </div>

  <!-- Modal Cài đặt -->
  <div id="configModal" class="app-modal">
    <div class="modal-content" style="max-width: 320px;">
      <div class="modal-header"><span>⚙️ Thiết lập hệ thống</span><button onclick="closeModals()" class="btn-small del">Đóng</button></div>
      <div class="modal-body">
        <div class="form-group"><label>Tìm lý trình:</label><select id="settingMarkerBehavior"><option value="keep">Giữ điểm ghim</option><option value="auto_hide">Tự động ẩn sau 5s</option></select></div>
        <div class="form-group" style="margin-top: 10px;"><button class="btn-action" style="background:#6610f2;" onclick="taiDuLieuSupabase()">🔄 TẢI LẠI DỮ LIỆU BẢN ĐỒ</button></div>
        
        <!-- Khối này chỉ hiện cho sys_admin -->
        <div id="adminMenuSection" style="display: none; border-top: 1px dashed #ccc; margin-top: 15px; padding-top: 10px;">
          <label style="font-size: 10px; font-weight: bold; margin-bottom: 5px; display:block;">Quyền Quản trị viên:</label>
          <button class="btn-action btn-success" onclick="moModalQuanLyThanhVien()" style="margin-bottom: 5px;">👥 Quản lý thành viên</button>
          <button class="btn-action btn-warning" onclick="chuanBiFormThemThanhVien()">+ Thêm tài khoản</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal CRUD (Thêm/Sửa/Xóa điểm bản đồ) -->
  <div id="crudModal" class="app-modal">
    <div class="modal-content">
      <div class="modal-header"><span id="crudTitle">📝 Thông tin Đối tượng</span><button onclick="closeModals()" class="btn-small del">Đóng</button></div>
      <div class="modal-body">
        <input type="hidden" id="crudActionType">
        <input type="hidden" id="crudObjectId">
        <div class="form-group"><label>Tên Điểm / Măng xông:</label><input type="text" id="crudObjectName" placeholder="Nhập tên..."></div>
        <div class="form-group"><label>Lý trình (Tùy chọn):</label><input type="text" id="crudObjectLyTrinh" placeholder="VD: 54+100"></div>
        <div class="form-group"><label>Vĩ độ (Lat):</label><input type="text" id="crudObjectLat" disabled></div>
        <div class="form-group"><label>Kinh độ (Lng):</label><input type="text" id="crudObjectLng" disabled></div>
        <div class="form-group" style="margin-top: 15px;"><button class="btn-action btn-success" id="btnConfirmCrud" onclick="executeCrudAction()">XÁC NHẬN</button></div>
      </div>
    </div>
  </div>

  <!-- Modal Quản Lý Thành Viên -->
  <div id="manageMembersModal" class="app-modal">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header"><span>👥 Quản Lý Thành Viên</span><button onclick="closeModals()" class="btn-small del">Đóng</button></div>
      <div class="modal-body">
        <table style="width: 100%; border-collapse: collapse; font-size: 12px; text-align: left;">
          <thead style="background: #0d6efd; color: white;"><tr><th style="padding:8px;">Email</th><th style="padding:8px;">Vai trò</th><th style="padding:8px;">Thao tác</th></tr></thead>
          <tbody id="memberTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Thêm Thành Viên Mới -->
  <div id="addMemberModal" class="app-modal">
    <div class="modal-content" style="max-width: 380px;">
      <div class="modal-header"><span>👥 Thêm Thành Viên Mới</span><button onclick="closeModals()" class="btn-small del">Đóng</button></div>
      <div class="modal-body">
        <div class="form-group"><label>Email:</label><input type="email" id="newMemberEmail" placeholder="nhanvien@vnpt.vn"></div>
        <div class="form-group"><label>Mật khẩu:</label><input type="password" id="newMemberPass"></div>
        <div class="form-group"><label>Quyền:</label><select id="newMemberRole"><option value="member">Thành viên</option><option value="sys_admin">Admin Hệ thống</option></select></div>
        <div class="form-group"><label>Đài:</label><select id="newMemberDai"><option value="">-- Tất cả --</option></select></div>
        <div class="form-group"><label>Trạm:</label><select id="newMemberTram"><option value="">-- Tất cả --</option></select></div>
        <div class="form-group" style="margin-top: 15px;"><button class="btn-action btn-success" onclick="handleCreateMember()">TẠO TÀI KHOẢN</button></div>
        <small id="createMemberStatus" style="display:block; text-align:center; margin-top:8px;"></small>
      </div>
    </div>
  </div>

  <!-- ================= SCRIPTS HỆ THỐNG ================= -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>

  <script>
    // 1. Cấu hình Supabase (Giữ nguyên cấu hình của anh)
    const SUPABASE_URL = 'https://clddwitzwuewwxawuorv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_U3tMbsj5oQ9Wub1UAJO5Cw_NXt6Px8E';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // 2. Biến toàn cục
    var currentUser = { isLoggedIn: false, role: 'member', idDai: null, idTram: null };
    var map = null;
    var markersLayer = L.markerClusterGroup({ maxClusterRadius: 40 });
    var mxLayer = L.layerGroup();
    var polylinesLayer = L.layerGroup();
    var lyTrinhLayer = L.layerGroup();
    var foundMarkerLayer = null, foundMarkerTimer = null;

    // Dữ liệu giả lập để các Combo Box hoạt động
    var rawDaiList = [], rawTramList = [], rawTuyenList = [], rawDoanCapList = [], globalDataPoints = [];

    // 3. Hàm giao diện tiện ích
    function toggleGISPanel() { 
      var p = document.getElementById('control-panel'); 
      p.style.display = (p.style.display === 'none' || p.style.display === '') ? 'block' : 'none'; 
    }
    function openModal(id) { closeModals(); document.getElementById(id).style.display = 'flex'; }
    function closeModals() { 
      document.querySelectorAll('.app-modal').forEach(m => { 
        if(m.id !== 'loginModal' || !currentUser.isLoggedIn) m.style.display = 'none'; 
      }); 
    }

    // 4. XỬ LÝ ĐĂNG NHẬP & PHÂN QUYỀN (RBAC)
    async function handleSupabaseLogin() {
      var email = document.getElementById('loginEmail').value.trim();
      var pass = document.getElementById('loginPass').value;
      var statusEl = document.getElementById('loginStatus');

      if (!email || !pass) { statusEl.style.color = 'red'; statusEl.textContent = "Nhập đủ email và mật khẩu!"; return; }
      statusEl.style.color = '#0d6efd'; statusEl.textContent = "Đang kiểm tra bảo mật...";

      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
        if (authError) throw authError;

        // Lấy quyền từ bảng user_roles
        const { data: roleData, error: roleError } = await supabaseClient.from('user_roles').select('*').eq('id', authData.user.id).single();

        currentUser = roleError 
          ? { isLoggedIn: true, role: 'member', idDai: null, idTram: null }
          : { isLoggedIn: true, role: roleData.role, idDai: roleData.id_dai, idTram: roleData.id_tram };

        statusEl.style.color = 'green'; statusEl.textContent = "Thành công!";

        // Kích hoạt UI sau đăng nhập
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('sidebar-menu').style.display = 'flex';
        document.getElementById('control-panel').style.display = 'block';

        // Phân quyền Menu Cài đặt
        if (currentUser.role === 'sys_admin') {
          document.getElementById('adminMenuSection').style.display = 'block';
        }

        // Khởi tạo bản đồ & Dữ liệu
        setTimeout(() => { khoiTaoBanDoLeaflet(); }, 150);

      } catch (err) {
        statusEl.style.color = 'red'; statusEl.textContent = "Lỗi: " + err.message;
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      currentUser.isLoggedIn = false;
      document.getElementById('sidebar-menu').style.display = 'none';
      document.getElementById('control-panel').style.display = 'none';
      document.getElementById('adminMenuSection').style.display = 'none';
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('loginPass').value = '';
      if(map) { map.remove(); map = null; } // Xóa map cũ
    }

    // 5. KHỞI TẠO BẢN ĐỒ & LAYER
    function khoiTaoBanDoLeaflet() {
      if (map !== null) { map.invalidateSize(); return; }

      map = L.map('map', { center: [21.5942, 105.8481], zoom: 13, maxZoom: 21 });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21 }).addTo(map);
      
      markersLayer.addTo(map); mxLayer.addTo(map); polylinesLayer.addTo(map); lyTrinhLayer.addTo(map);

      // Phân quyền click chuột phải (Chỉ cho phép admin)
      map.on('contextmenu', function(e) {
        if (currentUser.role === 'member') { alert("⚠️ Tài khoản Thành viên không có quyền Thêm Điểm mới."); return; }
        moFormCrud('ADD', null, '', e.latlng.lat.toFixed(6), e.latlng.lng.toFixed(6));
      });

      // Tải dữ liệu các combo
      taiDuLieuSupabase();
    }

    // 6. XỬ LÝ DỮ LIỆU & COMBO BOX LIÊN HOÀN
    function taiDuLieuSupabase() {
      // Dữ liệu mẫu nạp vào để UI hoạt động. (Trong thực tế sẽ fetch từ Supabase)
      rawDaiList = [{ id_dai: 1, ten_dai: 'Đài Thái Nguyên' }, { id_dai: 2, ten_dai: 'Đài Phổ Yên' }];
      rawTramList = [{ id_tram: 1, ten_tram: 'Trạm TNN', id_dai: 1 }, { id_tram: 2, ten_tram: 'Trạm A', id_dai: 1 }];
      rawTuyenList = [{ id_tuyen_cap: 1, ma_tuyencap: 'TNN-01' }];
      rawDoanCapList = [{ id_doan_cap: 1, ma_doancap: 'Đoạn 1 (TNN -> Mỏ Bạch)', id_tuyen: 1 }];
      
      // Dữ liệu marker
      globalDataPoints = [ 
        { id: 'm1', ten: 'MX-01', lat: 21.5942, lng: 105.8481, lyTrinh: '54+100', idDai:1, idTram:1, idTuyen:1, idDoanCap:1, loai: 'Măng xông' },
        { id: 'm2', ten: 'MX-02', lat: 21.5955, lng: 105.8500, lyTrinh: '54+800', idDai:1, idTram:1, idTuyen:1, idDoanCap:1, loai: 'Măng xông' }
      ];

      khoiTaoComboDai();
    }

    function khoiTaoComboDai() {
      var selDai = document.getElementById('selectDai');
      selDai.innerHTML = '<option value="ALL">-- Tất cả Đài --</option>';
      rawDaiList.forEach(d => selDai.innerHTML += `<option value="${d.id_dai}">${d.ten_dai}</option>`);
      
      // Phân quyền khóa Combo nếu là member
      if (currentUser.role === 'member' && currentUser.idDai) {
        selDai.value = currentUser.idDai; selDai.disabled = true;
      } else { selDai.disabled = false; }
      
      onDaiChange();
    }

    function onDaiChange() {
      var dv = document.getElementById('selectDai').value, selTram = document.getElementById('selectTram');
      selTram.innerHTML = '<option value="ALL">-- Tất cả Trạm --</option>';
      rawTramList.filter(t => dv === 'ALL' || t.id_dai == dv).forEach(t => selTram.innerHTML += `<option value="${t.id_tram}">${t.ten_tram}</option>`);
      
      if (currentUser.role === 'member' && currentUser.idTram) {
        selTram.value = currentUser.idTram; selTram.disabled = true;
      } else { selTram.disabled = false; }
      
      updateTuyenOptions();
    }

    function updateTuyenOptions() {
      var selTuyen = document.getElementById('selectTuyen');
      selTuyen.innerHTML = '<option value="ALL">-- Chọn Tuyến --</option>';
      rawTuyenList.forEach(t => selTuyen.innerHTML += `<option value="${t.id_tuyen_cap}">${t.ma_tuyencap}</option>`);
      onTuyenChange();
    }

    function onTuyenChange() {
      var selDoan = document.getElementById('selectDoanCap');
      selDoan.innerHTML = '<option value="ALL">-- Tất cả Đoạn --</option>';
      rawDoanCapList.forEach(dc => selDoan.innerHTML += `<option value="${dc.id_doan_cap}">${dc.ma_doancap}</option>`);
      onDoanCapChange();
    }

    function onDoanCapChange() {
      capNhatComboDiemA();
      veLaiTuyenAB();
    }

    function capNhatComboDiemA() {
      var combo = document.getElementById('comboDiemA');
      combo.innerHTML = '<option value="DEFAULT">📍 Trạm TNN</option>';
      globalDataPoints.forEach(pt => combo.innerHTML += `<option value="${pt.ten}">🔀 ${pt.ten}</option>`);
    }

    // 7. VẼ BẢN ĐỒ VÀ RENDER MARKERS (Kèm check quyền)
    function veLaiTuyenAB() {
      if(!map) return;
      markersLayer.clearLayers(); mxLayer.clearLayers();
      
      globalDataPoints.forEach(mx => {
        var marker = L.marker([mx.lat, mx.lng], { icon: L.divIcon({ className: '', html: '<div class="mx-marker"></div>', iconSize: [16, 16], iconAnchor: [8,8] }) });
        
        var popupHtml = `<b>${mx.ten}</b><br>Lý trình: <b>${mx.lyTrinh || '---'}</b>`;
        popupHtml += `<br><a href='https://www.google.com/maps/search/?api=1&query=${mx.lat},${mx.lng}' target='_blank' class='gmaps-btn'>🗺️ Dẫn đường</a>`;
        
        // RBAC: Chỉ Admin mới thấy nút Sửa/Xóa
        if (currentUser.role !== 'member') {
          popupHtml += `<hr style="margin:8px 0;">
            <button class="btn-small" onclick="moFormCrud('EDIT','${mx.id}','${mx.ten}',${mx.lat},${mx.lng})">✏️ Sửa</button>
            <button class="btn-small del" onclick="moFormCrud('DELETE','${mx.id}','${mx.ten}',${mx.lat},${mx.lng})">🗑️ Xóa</button>`;
        }
        
        marker.bindPopup(popupHtml);
        mxLayer.addLayer(marker);
      });

      // Zoom vừa màn hình nếu có điểm
      if(globalDataPoints.length > 0) {
        var group = new L.featureGroup([mxLayer]);
        map.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 16 });
      }
    }

    // 8. CRUD LOGIC CHO MARKERS
    function moFormCrud(action, id, name, lat, lng) {
      document.getElementById('crudActionType').value = action;
      document.getElementById('crudObjectId').value = id || '';
      document.getElementById('crudObjectName').value = name || '';
      document.getElementById('crudObjectLat').value = lat;
      document.getElementById('crudObjectLng').value = lng;
      
      var title = document.getElementById('crudTitle'), btn = document.getElementById('btnConfirmCrud'), nameInp = document.getElementById('crudObjectName');
      
      if(action === 'ADD') { title.innerHTML = '📍 THÊM MỚI'; btn.innerHTML = 'THÊM'; btn.className = 'btn-action btn-success'; nameInp.disabled = false; }
      else if(action === 'EDIT') { title.innerHTML = '✏️ SỬA ĐIỂM'; btn.innerHTML = 'LƯU'; btn.className = 'btn-action btn-warning'; nameInp.disabled = false; }
      else if(action === 'DELETE') { title.innerHTML = '🗑️ XÓA ĐIỂM'; btn.innerHTML = 'XÓA'; btn.className = 'btn-action btn-danger'; nameInp.disabled = true; }
      
      openModal('crudModal');
    }

    function executeCrudAction() {
      var act = document.getElementById('crudActionType').value;
      var name = document.getElementById('crudObjectName').value;
      if (act !== 'DELETE' && !name) { alert("Nhập tên!"); return; }
      alert(`Đã mô phỏng thao tác [${act}] cho: ${name}`);
      closeModals();
    }

    // 9. TÌM LÝ TRÌNH
    function timLyTrinhBanDo() {
      var txt = document.getElementById('txtTimLyTrinh').value.trim();
      if(!txt) return alert("Nhập lý trình!");
      
      var match = globalDataPoints.find(p => p.lyTrinh === txt);
      if(foundMarkerLayer) map.removeLayer(foundMarkerLayer);

      if(match) {
        map.setView([match.lat, match.lng], 19, { animate: true });
        foundMarkerLayer = L.marker([match.lat, match.lng], {
          icon: L.divIcon({ className: '', html: '<div style="font-size:30px;">📍</div>', iconSize: [30,30], iconAnchor:[15,30] })
        }).addTo(map);
        foundMarkerLayer.bindPopup(`<b>🎯 ĐÃ TÌM THẤY</b><br>${match.ten} (LT: ${match.lyTrinh})`).openPopup();
        
        if(document.getElementById('settingMarkerBehavior').value === 'auto_hide') {
          setTimeout(() => { if(foundMarkerLayer) map.removeLayer(foundMarkerLayer); }, 5000);
        }
      } else {
        alert("Không tìm thấy!");
      }
    }

    function timViTriDut() { alert("Chức năng phân tích OTDR đang được giả lập."); }

    // 10. QUẢN LÝ TÀI KHOẢN (SYS_ADMIN)
    function chuanBiFormThemThanhVien() {
      var selDai = document.getElementById('newMemberDai'); selDai.innerHTML = '<option value="">-- Tất cả --</option>';
      rawDaiList.forEach(d => selDai.innerHTML += `<option value="${d.id_dai}">${d.ten_dai}</option>`);
      var selTram = document.getElementById('newMemberTram'); selTram.innerHTML = '<option value="">-- Tất cả --</option>';
      rawTramList.forEach(t => selTram.innerHTML += `<option value="${t.id_tram}">${t.ten_tram}</option>`);
      openModal('addMemberModal');
    }

    async function handleCreateMember() {
      alert("Đã gọi hàm RPC create_new_user (Mô phỏng)");
      closeModals();
    }

    async function moModalQuanLyThanhVien() {
      openModal('manageMembersModal');
      document.getElementById('memberTableBody').innerHTML = '<tr><td colspan="3">Đang nạp danh sách... (Mô phỏng)</td></tr>';
    }
  </script>
