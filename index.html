<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống GIS & Định vị OTDR Cáp quang</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- SheetJS đọc Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; z-index: 1; }
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 99999; display: flex;
      justify-content: center; align-items: center; color: white; font-size: 1.2rem;
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- Thanh công cụ bên trái -->
  <div class="w-96 bg-white shadow-xl z-20 flex flex-col h-full">
    <div class="p-4 bg-blue-900 text-white font-bold text-lg flex items-center justify-between">
      <span>GIS & OTDR Mapping</span>
      <span class="text-xs bg-blue-700 px-2 py-1 rounded">VNPT Net1</span>
    </div>

    <div class="p-4 overflow-y-auto flex-1 space-y-4">
      <!-- 1. Import Excel -->
      <div class="border p-3 rounded bg-gray-50">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Import Dữ liệu Excel (3NF):</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="importHierarchicalExcelToSupabase(event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
      </div>

      <!-- 2. Chọn Tỉnh -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Chọn Tỉnh / Khu vực:</label>
        <select id="selectTinh" onchange="khiChonTinh(this.value)" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">-- Chọn Tỉnh --</option>
        </select>
      </div>

      <!-- 3. Chọn Tuyến cáp -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Chọn Tuyến Cáp quang:</label>
        <select id="selectTuyen" onchange="khiChonTuyen(this.value)" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">-- Chọn Tuyến Cáp --</option>
        </select>
      </div>

      <!-- 4. Định vị sự cố OTDR -->
      <div class="border-t pt-3 space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Điểm đo xuất phát (OTDR):</label>
          <select id="selectDiemDo" class="w-full border border-gray-300 rounded p-2 text-sm">
            <option value="">-- Chọn điểm đo --</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Khoảng cách sự cố đo được (mét):</label>
          <input type="number" id="inputKhoangCach" placeholder="Ví dụ: 1550" class="w-full border border-gray-300 rounded p-2 text-sm"/>
        </div>
        <button onclick="thucHienDinhViOTDR()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-sm transition">
          Định vị sự cố cáp
        </button>
      </div>

      <!-- Panel kết quả sự cố -->
      <div id="panelKetQua" class="border-t pt-3 hidden">
        <h3 class="font-bold text-gray-800 text-sm mb-1">Thông tin điểm sự cố:</h3>
        <div id="noiDungKetQua" class="bg-blue-50 p-2.5 rounded text-xs text-gray-700 space-y-1"></div>
      </div>
    </div>
  </div>

  <!-- Khu vực bản đồ Leaflet -->
  <div class="flex-1 relative h-full">
    <div id="map"></div>
  </div>

  <!-- Màn hình chờ Loading -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="bg-gray-900 bg-opacity-80 p-5 rounded-lg flex items-center space-x-3 shadow-2xl">
      <svg class="animate-spin h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      <span id="loadingText">Đang xử lý...</span>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Cấu hình kết nối Supabase của bạn
    const SUPABASE_URL = 'https://lmxbzjislncqkwmcnlgy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_nRRO1mpzjiCLRI57LihWyQ_DZhWZ9HK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Khởi tạo bản đồ Leaflet
    var map = L.map('map').setView([21.5942, 105.8482], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    var currentRouteLayer = null;
    var markerSuCo = null;
    window.chiTietTuyenHienTai = [];

    function showLoading(text) {
      document.getElementById('loadingText').innerText = text || "Đang xử lý...";
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }
    function showAlert(msg) {
      alert(msg);
    }

    // Tải dữ liệu ban đầu
    window.onload = async function() {
      setTimeout(function() { map.invalidateSize(); }, 300);
      await taiDuLieuTuSupabase(false);
    };

    async function taiDuLieuTuSupabase(isReload) {
      showLoading("Đang tải danh mục từ Supabase...");
      try {
        var resTinh = await supabaseClient.from('tinh').select('id, ma_tinh, ten_tinh');
        if (resTinh.error) throw resTinh.error;
        window.danhSachTinh = resTinh.data || [];

        var selectTinh = document.getElementById('selectTinh');
        selectTinh.innerHTML = '<option value="">-- Chọn Tỉnh --</option>';
        window.danhSachTinh.forEach(function(t) {
          selectTinh.innerHTML += '<option value="' + t.id + '">' + t.ten_tinh + ' (' + t.ma_tinh + ')</option>';
        });

        var resTuyen = await supabaseClient.from('tuyen_cap').select('id, tinh_id, ma_tuyen, ten_tuyen');
        if (resTuyen.error) throw resTuyen.error;
        window.danhSachTuyen = resTuyen.data || [];

        hideLoading();
        if (isReload) showAlert("Đã làm mới dữ liệu thành công!");
      } catch (err) {
        hideLoading();
        console.error("Lỗi tải dữ liệu:", err);
      }
    }

    function khiChonTinh(tinhId) {
      var selectTuyen = document.getElementById('selectTuyen');
      selectTuyen.innerHTML = '<option value="">-- Chọn Tuyến Cáp --</option>';
      if (!tinhId) return;

      var tuyens = window.danhSachTuyen.filter(function(r) { return r.tinh_id == tinhId; });
      tuyens.forEach(function(rt) {
        selectTuyen.innerHTML += '<option value="' + rt.id + '">' + (rt.ten_tuyen || rt.ma_tuyen) + '</option>';
      });
    }

    // Vẽ tuyến cáp và nạp danh sách điểm đo
    async function khiChonTuyen(tuyenId) {
      if (!tuyenId) return;
      showLoading("Đang vẽ bản đồ tuyến cáp...");

      try {
        var resChiTiet = await supabaseClient
          .from('tuyen_chi_tiet')
          .select('stt, ly_trinh, du_tru, do_cach, diem_ha_tang(id, ten_diem, loai, lat, long)')
          .eq('tuyen_id', tuyenId)
          .order('stt', { ascending: true });

        if (resChiTiet.error) throw resChiTiet.error;
        window.chiTietTuyenHienTai = resChiTiet.data || [];

        if (window.chiTietTuyenHienTai.length === 0) {
          hideLoading();
          showAlert("Tuyến cáp này chưa có dữ liệu điểm hạ tầng!");
          return;
        }

        if (currentRouteLayer) map.removeLayer(currentRouteLayer);
        if (markerSuCo) map.removeLayer(markerSuCo);

        var latlngs = [];
        var pointGroup = L.layerGroup();
        var selectDiemDo = document.getElementById('selectDiemDo');
        selectDiemDo.innerHTML = '<option value="">-- Chọn điểm đo OTDR --</option>';

        window.chiTietTuyenHienTai.forEach(function(item) {
          var pt = item.diem_ha_tang;
          if (!pt) return;
          var lat = parseFloat(pt.lat);
          var lng = parseFloat(pt.long);
          if (isNaN(lat) || isNaN(lng)) return;

          latlngs.push([lat, lng]);
          selectDiemDo.innerHTML += '<option value="' + pt.id + '">' + pt.ten_diem + ' (STT: ' + item.stt + ' - ' + (item.ly_trinh || 'Km ?') + ')</option>';

          var color = (pt.loai && pt.loai.toLowerCase().includes('mang')) ? 'orange' : 'blue';
          var marker = L.circleMarker([lat, lng], {
            radius: 5, fillColor: color, color: '#000', weight: 1, fillOpacity: 0.8
          }).bindPopup('<b>Điểm:</b> ' + pt.ten_diem + '<br><b>Loại:</b> ' + pt.loai + '<br><b>Lý trình:</b> ' + (item.ly_trinh || 'N/A') + '<br><b>Dự trữ:</b> ' + item.du_tru + 'm');
          pointGroup.addLayer(marker);
        });

        if (latlngs.length > 0) {
          var polyline = L.polyline(latlngs, { color: 'red', weight: 4, opacity: 0.8 });
          currentRouteLayer = L.layerGroup([polyline, pointGroup]);
          currentRouteLayer.addTo(map);
          map.fitBounds(polyline.getBounds());
          setTimeout(function() { map.invalidateSize(); }, 200);
        }

        hideLoading();
      } catch (err) {
        hideLoading();
        showAlert("Lỗi tải tuyến: " + err.message);
      }
    }

    // Thuật toán định vị sự cố OTDR
    function thucHienDinhViOTDR() {
      var tuyenId = document.getElementById('selectTuyen').value;
      var diemDoId = document.getElementById('selectDiemDo').value;
      var khoangCach = parseFloat(document.getElementById('inputKhoangCach').value);

      if (!tuyenId || !diemDoId || isNaN(khoangCach)) {
        showAlert("Vui lòng chọn đầy đủ Tuyến, Điểm đo và nhập khoảng cách đo OTDR hợp lệ!");
        return;
      }

      var danhSach = window.chiTietTuyenHienTai || [];
      var idxBatDau = danhSach.findIndex(function(x) { return x.diem_ha_tang && x.diem_ha_tang.id == diemDoId; });
      if (idxBatDau === -1) {
        showAlert("Không tìm thấy điểm đo xuất phát trên tuyến!");
        return;
      }

      var khoangCachTichLuy = 0;
      var diemGanNhat = null;
      var diemTiepTheo = null;

      for (var i = idxBatDau; i < danhSach.length - 1; i++) {
        var p1 = danhSach[i].diem_ha_tang;
        var p2 = danhSach[i+1].diem_ha_tang;
        if (!p1 || !p2) continue;

        var latlng1 = L.latLng(parseFloat(p1.lat), parseFloat(p1.long));
        var latlng2 = L.latLng(parseFloat(p2.lat), parseFloat(p2.long));
        var khoangCachDoan = latlng1.distanceTo(latlng2);

        if (khoangCachTichLuy + khoangCachDoan >= khoangCach) {
          diemGanNhat = danhSach[i];
          diemTiepTheo = danhSach[i+1];
          break;
        }
        khoangCachTichLuy += khoangCachDoan;
      }

      var panel = document.getElementById('panelKetQua');
      var noiDung = document.getElementById('noiDungKetQua');
      panel.classList.remove('hidden');

      if (diemGanNhat && diemTiepTheo) {
        noiDung.innerHTML = 
          '<b>Trạng thái:</b> Định vị thành công!<br>' +
          '<b>Khoảng cách OTDR:</b> ' + khoangCach + ' mét<br>' +
          '<b>Đoạn cáp:</b> ' + diemGanNhat.diem_ha_tang.ten_diem + ' &rarr; ' + diemTiepTheo.diem_ha_tang.ten_diem + '<br>' +
          '<b>Lý trình tại điểm đầu:</b> ' + (diemGanNhat.ly_trinh || 'N/A');

        var lat1 = parseFloat(diemGanNhat.diem_ha_tang.lat);
        var lng1 = parseFloat(diemGanNhat.diem_ha_tang.long);
        var lat2 = parseFloat(diemTiepTheo.diem_ha_tang.lat);
        var lng2 = parseFloat(diemTiepTheo.diem_ha_tang.long);
        
        var lenDoan = L.latLng(lat1, lng1).distanceTo(L.latLng(lat2, lng2));
        var r = lenDoan > 0 ? (khoangCach - khoangCachTichLuy) / lenDoan : 0;
        var latSuCo = lat1 + r * (lat2 - lat1);
        var lngSuCo = lng1 + r * (lng2 - lng1);

        if (markerSuCo) map.removeLayer(markerSuCo);
        markerSuCo = L.marker([latSuCo, lngSuCo], {
          icon: L.divIcon({ className: 'custom-icon', html: '<div style="background:red;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>' })
        }).addTo(map).bindPopup('<b>ĐIỂM SỰ CỐ OTDR</b><br>Cách điểm đo: ' + khoangCach + 'm').openPopup();

        map.setView([latSuCo, lngSuCo], 16);
      } else {
        noiDung.innerHTML = '<span class="text-red-600 font-semibold">Khoảng cách đo vượt quá chiều dài của tuyến cáp!</span>';
      }
    }

    // Hàm Import Excel chuẩn 3NF
    async function importHierarchicalExcelToSupabase(event) {
      var file = event.target.files[0];
      if (!file) return;

      showLoading("Đang đọc và đồng bộ tệp Excel vào CSDL 3NF...");

      var reader = new FileReader();
      reader.onload = async function(e) {
        try {
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, { type: 'array' });

          var daiMap = new Map();
          var tinhMap = new Map();
          var routeMap = new Map();
          var phanDoanMap = new Map();
          var pointsMap = new Map();
          var rawDetails = [];
          var totalRead = 0;

          for (var sIdx = 0; sIdx < workbook.SheetNames.length; sIdx++) {
            var sheetName = workbook.SheetNames[sIdx];
            var sheet = workbook.Sheets[sheetName];
            if (!sheet) continue;
            
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            if (!rows || rows.length < 2) continue;

            var headerRow = rows[0] || [];
            var h = headerRow.map(function(item) { return item ? String(item).trim().toLowerCase() : ''; });

            var iStt = h.findIndex(function(x) { return x === 'stt' || x.includes('thứ tự'); });
            var iDai = h.findIndex(function(x) { return x.includes('dai_vt') || x.includes('đài'); });
            var iTinh = h.findIndex(function(x) { return x.includes('tinh') || x.includes('tỉnh'); });
            var iTuyen = h.findIndex(function(x) { return x.includes('tuyen') || x.includes('tuyến'); });
            var iPhanDoan = h.findIndex(function(x) { return x.includes('phan_doan') || x.includes('phân đoạn'); });
            var iTen = h.findIndex(function(x) { return x.includes('ten_diem') || x.includes('tên điểm') || x.includes('diem') || x.includes('tên'); });
            var iLat = h.findIndex(function(x) { return x === 'lat' || x.includes('vĩ') || x.includes('vi_do'); });
            var iLong = h.findIndex(function(x) { return x.includes('long') || x.includes('lng') || x.includes('kinh') || x.includes('kinh_do'); });
            var iLyTrinh = h.findIndex(function(x) { return x.includes('ly_trinh') || x.includes('lý trình'); });
            var iDuTru = h.findIndex(function(x) { return x.includes('du_tru') || x.includes('dự trữ'); });
            var iDoCach = h.findIndex(function(x) { return x.includes('do_cach') || x.includes('đo cách'); });

            if (iStt === -1) iStt = 0;
            if (iDai === -1) iDai = 1;
            if (iTinh === -1) iTinh = 2;
            if (iTuyen === -1) iTuyen = 3;
            if (iPhanDoan === -1) iPhanDoan = 4;
            if (iTen === -1) iTen = 5;
            if (iLat === -1) iLat = 7;
            if (iLong === -1) iLong = 8;
            if (iLyTrinh === -1) iLyTrinh = 9;

            for (var r = 1; r < rows.length; r++) {
              var row = rows[r];
              if (!row || !Array.isArray(row)) continue;

              var tenVal = row[iTen] !== undefined && row[iTen] !== null && String(row[iTen]).trim() !== '' 
                           ? String(row[iTen]).trim() 
                           : ("Diem_" + sIdx + "_" + r);

              var latVal = parseFloat(row[iLat]);
              var lngVal = parseFloat(row[iLong]);
              if (isNaN(latVal) || isNaN(lngVal) || latVal === 0 || lngVal === 0) continue;

              totalRead++;
              var sttVal = iStt !== -1 && !isNaN(row[iStt]) ? parseFloat(row[iStt]) : totalRead;
              var daiVal = iDai !== -1 && row[iDai] ? String(row[iDai]).trim() : "VT_NET1";
              var tinhVal = iTinh !== -1 && row[iTinh] ? String(row[iTinh]).trim() : "TNN";
              var tuyenVal = iTuyen !== -1 && row[iTuyen] ? String(row[iTuyen]).trim() : sheetName;
              var phanDoanVal = iPhanDoan !== -1 && row[iPhanDoan] ? String(row[iPhanDoan]).trim() : "Phân đoạn chính";
              
              var lyTrinhVal = iLyTrinh !== -1 && row[iLyTrinh] !== undefined ? String(row[iLyTrinh]).trim() : null;
              var duTruVal = iDuTru !== -1 && !isNaN(row[iDuTru]) ? parseFloat(row[iDuTru]) : 0;
              var doCachVal = iDoCach !== -1 && row[iDoCach] !== undefined ? String(row[iDoCach]).trim() : null;

              daiMap.set(daiVal, { ma_dai: daiVal, ten_dai: "Đài Viễn thông " + daiVal });
              tinhMap.set(tinhVal, { ma_tinh: tinhVal, ten_tinh: "Tỉnh " + tinhVal, dai_ma: daiVal });

              routeMap.set(tuyenVal, { ma_tuyen: tuyenVal, tinh_ma: tinhVal });
              phanDoanMap.set(tuyenVal + "_" + phanDoanVal, { tuyen_ma: tuyenVal, dai_ma: daiVal, ten_phan_doan: phanDoanVal });

              pointsMap.set(tinhVal + "_" + tenVal, {
                tinh_ma: tinhVal,
                ten_diem: tenVal,
                loai: tenVal.toLowerCase().includes('mx') ? 'Mang xong' : 'Be',
                lat: latVal,
                long: lngVal
              });

              rawDetails.push({
                tuyen_ma: tuyenVal,
                phan_doan_key: tuyenVal + "_" + phanDoanVal,
                tinh_ma: tinhVal,
                ten_diem: tenVal,
                stt: sttVal,
                ly_trinh: lyTrinhVal,
                du_tru: duTruVal,
                do_cach: doCachVal
              });
            }
          }

          if (rawDetails.length === 0) {
            hideLoading();
            showAlert("Không tìm thấy dữ liệu tọa độ hợp lệ trong file Excel!");
            return;
          }

          showLoading("Đang đồng bộ Đài VT & Tỉnh lên Supabase...");
          for (var [k, v] of daiMap) {
            var resDai = await supabaseClient.from('dai_vt').upsert(v, { onConflict: 'ma_dai' });
            if (resDai.error) throw resDai.error;
          }
          var dbDai = await supabaseClient.from('dai_vt').select('id, ma_dai');
          var daiIdMap = new Map();
          (dbDai.data || []).forEach(function(d) { daiIdMap.set(d.ma_dai, d.id); });

          for (var [k, v] of tinhMap) {
            var dId = daiIdMap.get(v.dai_ma);
            var resTinh = await supabaseClient.from('tinh').upsert({ ma_tinh: v.ma_tinh, ten_tinh: v.ten_tinh, dai_vt_id: dId }, { onConflict: 'ma_tinh' });
            if (resTinh.error) throw resTinh.error;
          }
          var dbTinh = await supabaseClient.from('tinh').select('id, ma_tinh');
          var tinhIdMap = new Map();
          (dbTinh.data || []).forEach(function(t) { tinhIdMap.set(t.ma_tinh, t.id); });

          showLoading("Đang đồng bộ Tuyến cáp...");
          var routesArr = Array.from(routeMap.values()).map(function(r) {
            return { tinh_id: tinhIdMap.get(r.tinh_ma), ma_tuyen: r.ma_tuyen, ten_tuyen: "Tuyến " + r.ma_tuyen };
          });
          for (var i = 0; i < routesArr.length; i += 500) {
            var resR = await supabaseClient.from('tuyen_cap').upsert(routesArr.slice(i, i+500), { onConflict: 'tinh_id,ma_tuyen' });
            if (resR.error) throw resR.error;
          }
          var dbRoutes = await supabaseClient.from('tuyen_cap').select('id, ma_tuyen');
          var routeIdMap = new Map();
          (dbRoutes.data || []).forEach(function(rt) { routeIdMap.set(rt.ma_tuyen, rt.id); });

          showLoading("Đang đồng bộ Phân đoạn tuyến...");
          for (var [k, v] of phanDoanMap) {
            var rId = routeIdMap.get(v.tuyen_ma);
            var dId = daiIdMap.get(v.dai_ma);
            if (rId && dId) {
              var resPD = await supabaseClient.from('phan_doan').upsert({ tuyen_id: rId, dai_vt_id: dId, ten_phan_doan: v.ten_phan_doan }, { onConflict: 'tuyen_id,ten_phan_doan' });
              if (resPD.error) throw resPD.error;
            }
          }
          var dbPhanDoan = await supabaseClient.from('phan_doan').select('id, tuyen_id, ten_phan_doan');
          var phanDoanIdMap = new Map();
          (dbPhanDoan.data || []).forEach(function(pd) { phanDoanIdMap.set(pd.tuyen_id + "_" + pd.ten_phan_doan, pd.id); });

          showLoading("Đang nạp danh mục điểm hạ tầng gốc...");
          var pointsArr = Array.from(pointsMap.values()).map(function(p) {
            return {
              tinh_id: tinhIdMap.get(p.tinh_ma),
              ten_diem: p.ten_diem,
              loai: p.loai,
              lat: p.lat,
              long: p.long
            };
          });
          for (var i = 0; i < pointsArr.length; i += 500) {
            var batch = pointsArr.slice(i, i + 500);
            var resP = await supabaseClient.from('diem_ha_tang').upsert(batch, { onConflict: 'tinh_id,ten_diem' });
            if (resP.error) throw resP.error;
          }

          var dbPoints = await supabaseClient.from('diem_ha_tang').select('id, ten_diem, tinh_id');
          var pointIdMap = new Map();
          (dbPoints.data || []).forEach(function(p) { pointIdMap.set(p.tinh_id + "_" + p.ten_diem, p.id); });

          showLoading("Đang nạp liên kết tuyến vào bảng tuyen_chi_tiet...");
          var uniqueDetailsMap = new Map();
          rawDetails.forEach(function(item) {
            var tId = tinhIdMap.get(item.tinh_ma);
            var rId = routeIdMap.get(item.tuyen_ma);
            var pId = pointIdMap.get(tId + "_" + item.ten_diem);
            var pdId = phanDoanIdMap.get(rId + "_" + item.phan_doan_key);
            if (rId && pId) {
              uniqueDetailsMap.set(rId + "_" + pId, {
                tuyen_id: rId,
                diem_id: pId,
                phan_doan_id: pdId || null,
                stt: item.stt,
                ly_trinh: item.ly_trinh,
                du_tru: item.du_tru,
                do_cach: item.do_cach
              });
            }
          });

          var detailsArr = Array.from(uniqueDetailsMap.values());
          for (var i = 0; i < detailsArr.length; i += 500) {
            var batchDT = detailsArr.slice(i, i + 500);
            var resDT = await supabaseClient.from('tuyen_chi_tiet').upsert(batchDT, { onConflict: 'tuyen_id,diem_id' });
            if (resDT.error) throw resDT.error;
          }

          hideLoading();
          showAlert("Import thành công trọn vẹn " + detailsArr.length + " bản ghi vào cơ sở dữ liệu 3NF!");
          await taiDuLieuTuSupabase(true);

        } catch (err) {
          hideLoading();
          showAlert("Lỗi Import: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }
  </script>
