<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ thống GIS & Định vị Cáp OTDR - TNN NET1 (Supabase)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #control-panel {
      position: absolute; top: 15px; left: 15px; z-index: 1000; background: white;
      padding: 15px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); width: 330px; max-height: 92vh; overflow-y: auto;
    }
    .panel-header {
      background-color: #0d6efd; color: white; padding: 10px 12px; font-weight: bold; font-size: 14px;
      border-radius: 6px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }
    .status-badge { background-color: #e8f4fd; color: #084298; border: 1px solid #b6effb; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #333; text-transform: uppercase; }
    .form-group select, .form-group input { width: 100%; padding: 7px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 12px; box-sizing: border-box; }
    .btn-action { background-color: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; padding: 11px; border-radius: 6px; font-size: 12px; width: 100%; margin-top: 4px; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 12px; background: #f8f9fa; padding: 6px 8px; border-radius: 4px; }
    #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99999; justify-content: center; align-items: center; color: #fff; font-size: 16px; flex-direction: column; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0d6efd; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 12px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .gmaps-btn { background: #4285F4; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; margin-top: 6px; font-weight: bold; display: inline-flex; text-decoration: none; }
    .standard-marker { width: 10px; height: 10px; background-color: #0d6efd; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.4); }
    .point-a-marker { background: #ffc107; color: #000; font-weight: bold; font-size: 12px; text-align: center; line-height: 28px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; }
    .point-b-marker { background: #dc3545; color: #fff; font-weight: bold; font-size: 12px; text-align: center; line-height: 28px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-overlay-text">Đang kết nối cơ sở dữ liệu...</div>
  </div>

  <div id="map"></div>

  <div id="control-panel">
    <div class="panel-header">
      <span>⚙️ GIS & OTDR (Supabase 3NF)</span>
    </div>

    <div class="panel-body-content">
      <div id="statusBadge" class="status-badge">Đang tải danh mục từ Supabase...</div>

      <div class="form-group">
        <label>1. Chọn tuyến cáp quang:</label>
        <select id="selectTuyen" onchange="onTuyenChange()">
          <option value="">-- Chọn tuyến --</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Nguồn điểm đo (Điểm A):</label>
        <select id="comboDiemA" onchange="onDiemAChange()">
          <option value="DEFAULT">📍 Trạm TNN (21.593365, 105.839945)</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="chkNghichHuong" onchange="onDiemAChange()">
        <label for="chkNghichHuong" style="margin-bottom:0; cursor:pointer;">Đo nghịch hướng (Quay đầu tuyến)</label>
      </div>

      <div class="form-group">
        <label>3. Hệ số chùng cáp:</label>
        <input type="number" id="txtDoChung" value="1.075" step="0.001">
      </div>

      <div class="form-group">
        <label>4. Khoảng cách đo OTDR (km):</label>
        <input type="number" id="txtKcOtdr" value="3.5" step="0.1">
      </div>

      <div class="form-group">
        <button class="btn-action" onclick="timViTriDut()">🔍 PHÂN TÍCH & TÌM SỰ CỐ</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <script>
    const SUPABASE_URL = 'https://lmxbzjislncqkwmcnlgy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_nRRO1mpzjiCLRI57LihWyQ_DZhWZ9HK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var map;
    var markersLayer = L.markerClusterGroup({ maxClusterRadius: 40 });
    var polylinesLayer = L.layerGroup();
    var currentRoutePoints = [];

    window.onload = function() {
      var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21 });
      map = L.map('map', { center: [21.5942, 105.8481], zoom: 13, layers: [osm] });
      polylinesLayer.addTo(map);
      markersLayer.addTo(map);

      taiDanhSachTuyenSupabase();
    };

    function showLoading(text) {
      document.getElementById('loading-overlay-text').textContent = text || "Đang tải...";
      document.getElementById('loading-overlay').style.display = 'flex';
    }
    function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

    // Truy vấn trực tiếp danh sách tuyến từ Supabase
    async function taiDanhSachTuyenSupabase() {
      showLoading("Đang tải danh mục tuyến từ Supabase...");
      try {
        var res = await supabaseClient.from('tuyen_cap').select('id, ma_tuyen, ten_tuyen').order('ma_tuyen');
        if (res.error) throw res.error;

        var select = document.getElementById('selectTuyen');
        select.innerHTML = '<option value="">-- Chọn tuyến --</option>';
        (res.data || []).forEach(function(rt) {
          var opt = document.createElement('option');
          opt.value = rt.id;
          opt.textContent = rt.ten_tuyen || rt.ma_tuyen;
          select.appendChild(opt);
        });

        hideLoading();
        document.getElementById('statusBadge').textContent = "Đã kết nối cơ sở dữ liệu Supabase thành công!";
      } catch (err) {
        hideLoading();
        alert("Lỗi tải danh mục tuyến: " + err.message);
      }
    }

    // Khi chọn tuyến, truy vấn chi tiết các điểm thuộc tuyến từ Supabase qua bảng trung gian
    async function onTuyenChange() {
      var tuyenId = document.getElementById('selectTuyen').value;
      if (!tuyenId) return;

      showLoading("Đang tải chi tiết tuyến từ cơ sở dữ liệu...");
      try {
        var res = await supabaseClient
          .from('tuyen_chi_tiet')
          .select('stt, ly_trinh, du_tru, do_cach, diem_ha_tang(id, ten_diem, loai, lat, long)')
          .eq('tuyen_id', tuyenId)
          .order('stt', { ascending: true });

        if (res.error) throw res.error;

        currentRoutePoints = (res.data || []).map(function(item) {
          return {
            id: item.diem_ha_tang.id,
            ten: item.diem_ha_tang.ten_diem,
            loai: item.diem_ha_tang.loai,
            lat: parseFloat(item.diem_ha_tang.lat),
            long: parseFloat(item.diem_ha_tang.long),
            lyTrinh: item.ly_trinh,
            duTru: item.du_tru,
            stt: item.stt
          };
        });

        capNhatComboDiemA();
        veBanDoTuyen();
        hideLoading();
      } catch (err) {
        hideLoading();
        alert("Lỗi tải chi tiết tuyến: " + err.message);
      }
    }

    function onDiemAChange() { veBanDoTuyen(); }

    function capNhatComboDiemA() {
      var combo = document.getElementById('comboDiemA');
      combo.innerHTML = '<option value="DEFAULT">📍 Trạm TNN (21.593365, 105.839945)</option>';
      currentRoutePoints.forEach(function(pt) {
        if (pt.loai && pt.loai.toLowerCase().includes('mang xông')) {
          var opt = document.createElement('option');
          opt.value = pt.ten;
          opt.textContent = "🔀 " + pt.ten;
          combo.appendChild(opt);
        }
      });
    }

    function veBanDoTuyen() {
      markersLayer.clearLayers();
      polylinesLayer.clearLayers();

      if (currentRoutePoints.length === 0) return;
      var pts = currentRoutePoints.slice();

      if (!pts.some(function(p) { return Math.abs(p.lat - 21.593365) < 0.00001; })) {
        pts.unshift({ ten: "Trạm TNN", lat: 21.593365, long: 105.839945, loai: "Trạm" });
      }

      if (document.getElementById('chkNghichHuong').checked) {
        pts.reverse();
      }

      var bounds = [];
      pts.forEach(function(pt, idx) {
        bounds.push([pt.lat, pt.long]);
        var html = idx === 0 ? '<div class="point-a-marker">A</div>' : (idx === pts.length - 1 ? '<div class="point-b-marker">B</div>' : '<div class="standard-marker"></div>');
        var marker = L.marker([pt.lat, pt.long], { icon: L.divIcon({ className: '', html: html, iconSize: [30, 30], iconAnchor: [15, 15] }) });
        marker.bindPopup("<b>Điểm:</b> " + pt.ten + "<br><b>Loại:</b> " + pt.loai + "<br><a href='https://www.google.com/maps/search/?api=1&query=" + pt.lat + "," + pt.long + "' target='_blank' class='gmaps-btn'>Google Maps</a>");
        markersLayer.addLayer(marker);
      });

      var line = pts.map(function(p) { return [p.lat, p.long]; });
      if (line.length > 1) {
        polylinesLayer.addLayer(L.polyline(line, { color: '#0d6efd', weight: 3.5 }));
      }
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    function timViTriDut() {
      alert("Thuật toán phân tích OTDR đã sẵn sàng trên nền tảng Database Supabase!");
    }
  </script>
</body>
</html>
