<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ Thống GIS & Định Vị Cáp OTDR - TNN NET1</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; overflow: hidden; display: flex; flex-direction: row; }
    #sidebar-menu { width: 70px; background-color: #212529; color: white; display: flex; flex-direction: column; align-items: center; padding-top: 15px; z-index: 2000; flex-shrink: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
    .menu-item { width: 50px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; margin-bottom: 12px; color: #adb5bd; cursor: pointer; font-size: 10px; transition: all 0.2s; }
    .menu-item:hover, .menu-item.active { background-color: #0d6efd; color: white; }
    .menu-item span.icon { font-size: 20px; margin-bottom: 2px; }
    #workspace { flex: 1; position: relative; height: 100%; }
    #map { width: 100%; height: 100%; }
    
    #control-panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 310px; }
    .panel-header { background-color: #0d6efd; color: white; padding: 8px 10px; font-weight: bold; font-size: 13px; border-radius: 5px; margin-bottom: 8px; user-select: none; }
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 3px; color: #333; text-transform: uppercase; }
    .form-group select, .form-group input { width: 100%; padding: 5px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 11px; box-sizing: border-box; }
    .form-group select:disabled { background-color: #e9ecef; cursor: not-allowed; }
    
    .btn-action { background-color: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; padding: 9px; border-radius: 5px; font-size: 11px; width: 100%; margin-top: 2px; box-shadow: 0 2px 4px rgba(220,53,69,0.3); }
    .btn-action:hover { background-color: #bb2d3b; }
    .btn-success { background-color: #198754; box-shadow: 0 2px 4px rgba(25,135,84,0.3); }
    .btn-success:hover { background-color: #157347; }
    .btn-warning { background-color: #ffc107; color: #000; box-shadow: 0 2px 4px rgba(255,193,7,0.3); }

    .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 8px; background: #f8f9fa; padding: 4px 6px; border-radius: 4px; }
    .checkbox-group input { width: auto; }

    #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 99999; justify-content: center; align-items: center; color: #fff; font-size: 16px; flex-direction: column; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0d6efd; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 12px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .app-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 90%; max-width: 600px; max-height: 85vh; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    #configModal .modal-content { max-width: 320px; padding: 15px; }
    #crudModal .modal-content { max-width: 350px; padding: 15px; }
    #loginModal .modal-content { max-width: 350px; padding: 15px; }
    #addMemberModal .modal-content { max-width: 380px; padding: 15px; }

    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; color: #0d6efd; font-size: 15px; }
    .modal-body { overflow-y: auto; flex-grow: 1; font-size: 12px; }
    .crud-info-box { background: #e9ecef; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px dashed #ccc; font-size: 11px; }

    .gmaps-btn { background: #4285F4; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; margin-top: 6px; font-weight: bold; display: inline-flex; gap: 4px; text-decoration: none; }
    .mx-marker { width: 14px; height: 14px; background-color: #198754; border: 2px solid #fff; transform: rotate(45deg); box-shadow: 0 0 6px rgba(0,0,0,0.4); }
    .standard-marker { width: 10px; height: 10px; background-color: #0d6efd; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.4); }
    .lytrinh-badge { background: #fd7e14; color: white; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; white-space: nowrap; }
    .btn-small { background: #0d6efd; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }
    .btn-small.del { background: #dc3545; }

    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar-menu { width: 100%; height: 55px; flex-direction: row; justify-content: space-around; padding-top: 0; }
      .menu-item { width: 45px; height: 45px; margin-bottom: 0; font-size: 9px; }
      #control-panel { width: 92% !important; left: 4% !important; top: 10px; }
    }
  </style>
</head>
<body>

  <!-- Menu Sidebar -->
  <div id="sidebar-menu">
    <div class="menu-item active" onclick="toggleGISPanel()" title="Ẩn/Hiện bảng điều khiển GIS"><span class="icon">🗺️</span><span>GIS</span></div>
    <div class="menu-item" onclick="openModal('configModal')" title="Thiết lập thông số"><span class="icon">⚙️</span><span>Cài đặt</span></div>
    <div class="menu-item" onclick="openModal('loginModal')" title="Đăng nhập hệ thống" style="margin-top: auto;"><span class="icon">👤</span><span>Login</span></div>
  </div>

  <div id="workspace">
    <div id="loading-overlay">
      <div class="spinner"></div><div id="loading-overlay-text">Đang đồng bộ dữ liệu hệ thống từ Supabase...</div>
    </div>
    <div id="map"></div>

    <!-- Bảng điều khiển gọn gàng, không scroll -->
    <div id="control-panel">
      <div class="panel-header"><span>🗺️ ĐIỀU KHIỂN & PHÂN TÍCH OTDR</span></div>
      <div class="panel-body-content" id="panelBodyContent">
        <div class="form-group">
          <label>1. Chọn Đài VT:</label>
          <select id="selectDai" onchange="onDaiChange()"><option value="ALL">-- Tất cả các Đài --</option></select>
        </div>
        <div class="form-group">
          <label>2. Chọn Trạm VT:</label>
          <select id="selectTram" onchange="onTramChange()"><option value="ALL">-- Tất cả các trạm --</option></select>
        </div>
        <div class="form-group">
          <label>3. Chọn Tuyến Cáp:</label>
          <select id="selectTuyen" onchange="onTuyenChange()"><option value="ALL">-- Chọn tuyến cáp --</option></select>
        </div>
        <div class="form-group">
          <label>4. Chọn Đoạn Cáp:</label>
          <select id="selectDoanCap" onchange="onDoanCapChange()"><option value="ALL">-- Tất cả đoạn tuyến --</option></select>
        </div>
        <div class="form-group">
          <label>5. Nguồn điểm đo:</label>
          <select id="comboDiemA" onchange="onDiemAChange()"><option value="DEFAULT">📍 Trạm TNN (21.593365, 105.839945)</option></select>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="chkNghichHuong" onchange="onDiemAChange()">
          <label for="chkNghichHuong" style="margin-bottom:0; cursor:pointer;">Đo nghịch hướng (Quay đầu)</label>
        </div>
        <div class="form-group">
          <label>6. Khoảng cách đo OTDR (km):</label>
          <input type="number" id="txtKcOtdr" value="3.5" step="0.1" placeholder="Nhập km từ máy đo...">
          <input type="hidden" id="txtDoChung" value="1.075">
        </div>
        <div class="form-group"><button class="btn-action" onclick="timViTriDut()">🔍 PHÂN TÍCH & TÌM VỊ TRÍ SỰ CỐ</button></div>
        
        <!-- Tìm nhanh lý trình -->
        <div class="form-group" style="border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 8px;">
          <label>7. Tìm nhanh Lý trình (QL):</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="txtTimLyTrinh" placeholder="VD: 54+100..." style="flex: 1;">
            <button class="btn-action btn-success" style="width: auto; margin-top: 0; padding: 5px 12px;" onclick="timLyTrinhBanDo()">🔍 TÌM</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal CRUD Điểm hạ tầng -->
  <div id="crudModal" class="app-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="crudTitle">📝 Thông tin Đối tượng</span>
        <button onclick="closeModals()" style="background:#dc3545; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-size:11px;">Đóng</button>
      </div>
      <div class="modal-body">
        <div class="crud-info-box" id="crudContextInfo">Vui lòng kiểm tra lại thông tin trước khi thực hiện thao tác.</div>
        <input type="hidden" id="crudActionType">
        <input type="hidden" id="crudObjectId">
        <div class="form-group"><label>Tên Điểm / Măng xông:</label><input type="text" id="crudObjectName" placeholder="Nhập tên..."></div>
        <div class="form-group"><label>Tọa độ Vĩ độ (Lat):</label><input type="text" id="crudObjectLat" disabled></div>
        <div class="form-group"><label>Tọa độ Kinh độ (Lng):</label><input type="text" id="crudObjectLng" disabled></div>
        <div class="form-group" style="margin-top: 15px;"><button class="btn-action btn-success" id="btnConfirmCrud" onclick="executeCrudAction()">XÁC NHẬN LƯU</button></div>
      </div>
    </div>
  </div>

  <!-- Modal Cài đặt (Thiết lập hệ thống gọn gàng) -->
  <div id="configModal" class="app-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>⚙️ Thiết lập hệ thống</span>
        <button onclick="closeModals()" style="background:#dc3545; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-size:11px;">Đóng</button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-top: 5px;"><button class="btn-action" style="background:#6610f2;" onclick="taiDuLieuSupabase(true)">🔄 LÀM MỚI CACHE</button></div>
        <div class="form-group" style="margin-top: 8px;"><button class="btn-action" onclick="xoaTuyenThuCong()">🗑️ LÀM SẠCH BẢN ĐỒ</button></div>
        
        <div class="form-group" style="margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 8px;">
          <label>Cài đặt kết quả tìm lý trình:</label>
          <select id="settingMarkerBehavior">
            <option value="keep">Giữ điểm ghim cố định</option>
            <option value="auto_hide">Tự động ẩn sau 5 giây</option>
          </select>
        </div>

        <!-- Nút quản lý thành viên (chỉ hiện cho admin) -->
        <div id="adminMenuSection" class="form-group" style="margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 8px; display: none;">
          <button class="btn-action btn-success" onclick="chuanBiFormThemThanhVien()">👥 Thêm tài khoản thành viên</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Đăng nhập Supabase Auth -->
  <div id="loginModal" class="app-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>👤 Đăng nhập Hệ Thống</span>
        <button onclick="closeModals()" style="background:#dc3545; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">Đóng</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Email đăng nhập:</label>
          <input type="email" id="loginEmail" placeholder="nhap.email@vnpt.vn">
        </div>
        <div class="form-group">
          <label>Mật khẩu:</label>
          <input type="password" id="loginPass" placeholder="••••••••">
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <button class="btn-action" style="background:#0d6efd;" onclick="handleSupabaseLogin()">ĐĂNG NHẬP</button>
        </div>
        <div style="text-align: center; margin-top: 10px;">
          <small id="loginStatus" style="color: #6c757d;"></small>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Thêm Thành Viên (Dành riêng cho Admin) -->
  <div id="addMemberModal" class="app-modal">
    <div class="modal-content" style="max-width: 380px;">
      <div class="modal-header">
        <span>👥 Thêm Thành Viên Mới</span>
        <button onclick="closeModals()" style="background:#dc3545; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">Đóng</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Email thành viên:</label>
          <input type="email" id="newMemberEmail" placeholder="nhanvien@vnpt.vn">
        </div>
        <div class="form-group">
          <label>Mật khẩu tạm thời:</label>
          <input type="password" id="newMemberPass" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Vai trò hệ thống:</label>
          <select id="newMemberRole">
            <option value="member">Thành viên (Member)</option>
            <option value="tram_admin">Admin Trạm</option>
            <option value="dai_admin">Admin Đài</option>
            <option value="sys_admin">Admin Hệ thống</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phạm vi Đài VT:</label>
          <select id="newMemberDai"><option value="">-- Toàn hệ thống --</option></select>
        </div>
        <div class="form-group">
          <label>Phạm vi Trạm VT:</label>
          <select id="newMemberTram"><option value="">-- Không giới hạn --</option></select>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <button class="btn-action btn-success" onclick="handleCreateMember()">💾 TẠO TÀI KHOẢN</button>
        </div>
        <div style="text-align: center; margin-top: 8px;">
          <small id="createMemberStatus" style="color: #6c757d;"></small>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <script>
    const SUPABASE_URL = 'https://clddwitzwuewwxawuorv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_U3tMbsj5oQ9Wub1UAJO5Cw_NXt6Px8E';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    var currentUser = { isLoggedIn: false, role: 'member', idDai: null, idTram: null };
    var foundMarkerTimer = null; 
    var map, markersLayer, mxLayer, polylinesLayer, lyTrinhLayer, foundMarkerLayer = null;
    var rawDaiList = [], rawTramList = [], rawTuyenList = [], rawDoanCapList = [], globalDataPoints = [];

    function toggleGISPanel() { closeModals(); var p = document.getElementById('control-panel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }
    function openModal(id) { closeModals(); var t = document.getElementById(id); if(t) t.style.display = 'flex'; }
    function closeModals() { document.querySelectorAll('.app-modal').forEach(m => m.style.display = 'none'); }

    async function handleSupabaseLogin() {
      var email = document.getElementById('loginEmail').value.trim();
      var pass = document.getElementById('loginPass').value;
      var statusEl = document.getElementById('loginStatus');

      if (!email || !pass) { statusEl.style.color = 'red'; statusEl.textContent = "Vui lòng nhập email và mật khẩu!"; return; }

      statusEl.style.color = '#0d6efd'; statusEl.textContent = "Đang xác thực...";

      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
        if (authError) throw authError;

        var user = authData.user;
        const { data: roleData, error: roleError } = await supabaseClient.from('user_roles').select('*').eq('id', user.id).single();

        if (roleError) {
          currentUser = { isLoggedIn: true, role: 'member', idDai: null, idTram: null };
        } else {
          currentUser = { isLoggedIn: true, role: roleData.role, idDai: roleData.id_dai, idTram: roleData.id_tram };
        }

        statusEl.style.color = 'green';
        statusEl.textContent = "Đăng nhập thành công! Quyền: " + currentUser.role;

        // Hiển thị tính năng Quản lý thành viên trong Cài đặt nếu là sys_admin
        if (currentUser.role === 'sys_admin') {
          document.getElementById('adminMenuSection').style.display = 'block';
        }

        khoiTaoComboDai();
        setTimeout(() => { closeModals(); }, 1200);
      } catch (err) {
        statusEl.style.color = 'red';
        statusEl.textContent = "Lỗi đăng nhập: " + err.message;
      }
    }

    window.onload = function() {
      var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19 });
      map = L.map('map', { center: [21.5942, 105.8481], zoom: 13, maxZoom: 21, layers: [osm] });
      polylinesLayer = L.layerGroup().addTo(map); 
      markersLayer = L.markerClusterGroup({ maxClusterRadius: 40 }).addTo(map); 
      mxLayer = L.layerGroup().addTo(map); 
      lyTrinhLayer = L.layerGroup().addTo(map);

      map.on('contextmenu', function(e) {
        if (currentUser.role === 'member') { alert("Thành viên không có quyền tạo điểm mới."); return; }
        moFormCrud('ADD', null, '', e.latlng.lat.toFixed(6), e.latlng.lng.toFixed(6));
      });
      taiDuLieuSupabase(false);
    };

    function showLoading(t) { document.getElementById('loading-overlay-text').textContent = t; document.getElementById('loading-overlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

    function parseLyTrinh(str) {
      if (!str) return { meters: null, suffix: "" };
      var s = str.toString().trim();
      var match = s.match(/(?:km\s*)?(\d+)\s*\+\s*(\d+)(.*)/i);
      if (match) {
        return { meters: (parseInt(match[1]) || 0) * 1000 + (parseInt(match[2]) || 0), suffix: match[3] ? match[3].trim() : "" };
      }
      return { meters: null, suffix: "" };
    }

    function timLyTrinhBanDo() {
      var inputStr = document.getElementById('txtTimLyTrinh').value.trim();
      if (!inputStr) { alert("Vui lòng nhập lý trình cần tìm!"); return; }

      var targetPf = parseLyTrinh(inputStr);
      if (targetPf.meters === null) { alert("Định dạng không hợp lệ. Vui lòng nhập theo mẫu 'Km 54+100' hoặc '54+100'."); return; }

      var selTuyenId = document.getElementById('selectTuyen').value;
      if (selTuyenId === 'ALL') { alert("Vui lòng chọn tuyến cáp trước khi tìm kiếm."); return; }

      var tramVal = document.getElementById('selectTram').value;
      var pts = globalDataPoints.filter(function(pt) { return (tramVal === 'ALL' || pt.idTram == tramVal) && (pt.idTuyen == selTuyenId); });

      if (pts.length === 0) { alert("Tuyến này chưa có dữ liệu hạ tầng."); return; }

      var closestPt = null, minDiff = Infinity;
      pts.forEach(function(pt) {
        var ptPf = parseLyTrinh(pt.lyTrinh);
        if (ptPf.meters !== null) {
          var diff = Math.abs(ptPf.meters - targetPf.meters);
          if (diff < minDiff) { minDiff = diff; closestPt = pt; }
        }
      });

      if (foundMarkerLayer) { map.removeLayer(foundMarkerLayer); }
      if (foundMarkerTimer) { clearTimeout(foundMarkerTimer); foundMarkerTimer = null; }

      if (closestPt && minDiff <= 3000) { 
        map.setView([closestPt.lat, closestPt.lng], 19, { animate: true });
        
        var markerHtml = '<div style="background:#0dcaf0; color:#000; width:30px; height:30px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; font-weight:bold; box-shadow:0 0 10px rgba(13,202,240,0.9);">📍</div>';
        foundMarkerLayer = L.marker([closestPt.lat, closestPt.lng], {
          icon: L.divIcon({ className: '', html: markerHtml, iconSize: [30, 30], iconAnchor: [15, 15] })
        }).addTo(map);
        
        foundMarkerLayer.bindPopup("<b>🎯 KẾT QUẢ TÌM KIẾM</b><br>Tên điểm: <b>" + closestPt.ten + "</b><br>Lý trình: <b>" + closestPt.lyTrinh + "</b><br><i>Lệch khoảng " + minDiff + "m</i>").openPopup();
        
        var settingBehavior = document.getElementById('settingMarkerBehavior').value;
        if (settingBehavior === 'auto_hide') {
            foundMarkerTimer = setTimeout(function() {
                if (foundMarkerLayer) { map.removeLayer(foundMarkerLayer); foundMarkerLayer = null; }
            }, 5000);
        }
      } else {
        alert("Không tìm thấy dữ liệu gần lý trình này.");
      }
    }

    function moFormCrud(action, id, name, lat, lng) {
      document.getElementById('crudActionType').value = action;
      document.getElementById('crudObjectId').value = id || '';
      document.getElementById('crudObjectName').value = name || '';
      document.getElementById('crudObjectLat').value = lat;
      document.getElementById('crudObjectLng').value = lng;
      
      var title = document.getElementById('crudTitle'), btn = document.getElementById('btnConfirmCrud'), nameInput = document.getElementById('crudObjectName');
      if(action === 'ADD') { title.innerHTML = '📍 THÊM ĐIỂM MỚI'; btn.innerHTML = 'XÁC NHẬN THÊM'; btn.className = 'btn-action btn-success'; nameInput.disabled = false; }
      else if (action === 'EDIT') { title.innerHTML = '✏️ SỬA ĐIỂM'; btn.innerHTML = 'XÁC NHẬN LƯU'; btn.className = 'btn-action btn-warning'; nameInput.disabled = false; }
      else if (action === 'DELETE') { title.innerHTML = '🗑️ XÓA ĐIỂM'; btn.innerHTML = 'XÁC NHẬN XÓA'; btn.className = 'btn-action'; nameInput.disabled = true; }
      openModal('crudModal');
    }

    function executeCrudAction() {
      var action = document.getElementById('crudActionType').value;
      var name = document.getElementById('crudObjectName').value;
      if (action !== 'DELETE' && !name) { alert("Vui lòng nhập tên đối tượng!"); return; }
      showLoading("Đang xử lý dữ liệu...");
      setTimeout(() => { hideLoading(); alert("Thao tác " + action + " thành công cho: " + name); closeModals(); }, 800);
    }

    function chuanBiFormThemThanhVien() {
      var selDai = document.getElementById('newMemberDai');
      selDai.innerHTML = '<option value="">-- Toàn hệ thống --</option>';
      rawDaiList.forEach(d => selDai.innerHTML += `<option value="${d.id_dai}">${d.ten_dai}</option>`);

      var selTram = document.getElementById('newMemberTram');
      selTram.innerHTML = '<option value="">-- Không giới hạn --</option>';
      rawTramList.forEach(t => selTram.innerHTML += `<option value="${t.id_tram}">${t.ten_tram}</option>`);

      openModal('addMemberModal');
    }

    async function handleCreateMember() {
      var email = document.getElementById('newMemberEmail').value.trim();
      var password = document.getElementById('newMemberPass').value;
      var role = document.getElementById('newMemberRole').value;
      var idDai = document.getElementById('newMemberDai').value || null;
      var idTram = document.getElementById('newMemberTram').value || null;
      var statusEl = document.getElementById('createMemberStatus');

      if (!email || !password) { statusEl.style.color = 'red'; statusEl.textContent = "Nhập đủ email và mật khẩu!"; return; }

      statusEl.style.color = '#0d6efd'; statusEl.textContent = "Đang tạo tài khoản...";

      try {
        const { error } = await supabaseClient.rpc('create_new_user', {
          user_email: email, user_password: password, user_role: role,
          target_id_dai: idDai ? parseInt(idDai) : null,
          target_id_tram: idTram ? parseInt(idTram) : null
        });

        if (error) throw error;
        statusEl.style.color = 'green';
        statusEl.textContent = "Tạo thành công tài khoản: " + email;
        setTimeout(() => { closeModals(); document.getElementById('newMemberEmail').value = ''; document.getElementById('newMemberPass').value = ''; }, 1500);
      } catch (err) {
        statusEl.style.color = 'red';
        statusEl.textContent = "Lỗi: " + err.message;
      }
    }

    async function taiDuLieuSupabase(forceRefresh = false) {
      rawDaiList = [{ id_dai: 1, ten_dai: 'Đài Thái Nguyên' }, { id_dai: 2, ten_dai: 'Đài Phổ Yên' }];
      rawTramList = [{ id_tram: 1, ten_tram: 'Trạm A', id_dai: 1 }, { id_tram: 2, ten_tram: 'Trạm TNN', id_dai: 1 }];
      rawTuyenList = [{ id_tuyen_cap: 1, ma_tuyencap: 'TNN-01' }];
      rawDoanCapList = [{ id_doan_cap: 1, ma_doancap: 'Đoạn 1', id_tuyen: 1 }];
      globalDataPoints = [ { id: '1', ten: 'MX-01', lat: 21.5942, lng: 105.8481, lyTrinh: 'Km 54+100', idDai:1, idTram:2, idTuyen:1, idDoanCap:1, stt:9999, loai: 'Măng xông' } ];
      khoiTaoComboDai();
    }

    function khoiTaoComboDai() {
      var selDai = document.getElementById('selectDai'); selDai.innerHTML = '<option value="ALL">-- Tất cả các Đài --</option>';
      rawDaiList.forEach(d => selDai.innerHTML += `<option value="${d.id_dai}">${d.ten_dai}</option>`);
      if (currentUser.role === 'member' && currentUser.idDai) { selDai.value = currentUser.idDai; selDai.disabled = true; } else { selDai.disabled = false; }
      onDaiChange();
    }

    function onDaiChange() {
      var daiVal = document.getElementById('selectDai').value, selTram = document.getElementById('selectTram');
      selTram.innerHTML = '<option value="ALL">-- Tất cả các trạm --</option>';
      rawTramList.filter(t => daiVal === 'ALL' || t.id_dai == daiVal).forEach(t => selTram.innerHTML += `<option value="${t.id_tram}">${t.ten_tram}</option>`);
      if (currentUser.role === 'member' && currentUser.idTram) { selTram.value = currentUser.idTram; selTram.disabled = true; } else { selTram.disabled = false; }
      updateTuyenOptions();
    }

    function updateTuyenOptions() {
      var selTuyen = document.getElementById('selectTuyen'); selTuyen.innerHTML = '<option value="ALL">-- Chọn tuyến cáp --</option>';
      rawTuyenList.forEach(t => selTuyen.innerHTML += `<option value="${t.id_tuyen_cap}">${t.ma_tuyencap}</option>`);
      if (currentUser.role === 'member') { selTuyen.value = 'ALL'; selTuyen.disabled = true; } else { selTuyen.disabled = false; }
      onTuyenChange();
    }

    function onTuyenChange() {
      var selTuyen = document.getElementById('selectTuyen').value, selDoanCap = document.getElementById('selectDoanCap');
      selDoanCap.innerHTML = '<option value="ALL">-- Tất cả đoạn tuyến --</option>';
      rawDoanCapList.forEach(dc => selDoanCap.innerHTML += `<option value="${dc.id_doan_cap}">${dc.ma_doancap}</option>`);
      onDoanCapChange();
    }

    function onDoanCapChange() { capNhatComboDiemA(); veLaiTuyenAB(); }
    function onDiemAChange() { veLaiTuyenAB(); }

    function isMangXong(pt) { return pt.loai.toUpperCase().includes('MĂNG XÔNG') || pt.loai.toUpperCase().includes('MX'); }

    function capNhatComboDiemA() {
      var combo = document.getElementById('comboDiemA'); combo.innerHTML = '<option value="DEFAULT">📍 Trạm TNN (21.593365, 105.839945)</option>';
      globalDataPoints.filter(isMangXong).forEach(pt => combo.innerHTML += `<option value="${pt.ten}">🔀 ${pt.ten}</option>`);
    }

    function veLaiTuyenAB() {
      markersLayer.clearLayers(); mxLayer.clearLayers(); polylinesLayer.clearLayers(); lyTrinhLayer.clearLayers(); if (foundMarkerLayer) map.removeLayer(foundMarkerLayer);
      globalDataPoints.filter(isMangXong).forEach(function(mx) {
        var lat = parseFloat(mx.lat), lng = parseFloat(mx.lng);
        var mxMarker = L.marker([lat, lng], { icon: L.divIcon({ className: '', html: '<div class="mx-marker"></div>', iconSize: [30, 30], iconAnchor: [15, 15] }) });
        var mxPopup = `<b>${mx.ten}</b><br>Lý trình: <b>${mx.lyTrinh || 'Trống'}</b><br><a href='https://www.google.com/maps/search/?api=1&query=${lat},${lng}' target='_blank' class='gmaps-btn'>🗺️ Dẫn đường</a>`;
        if (currentUser.role !== 'member') { 
          mxPopup += `<hr style="margin:5px 0;"><button class="btn-small" onclick="moFormCrud('EDIT', '${mx.id}', '${mx.ten}', ${lat}, ${lng})">✏️ Sửa</button> <button class="btn-small del" onclick="moFormCrud('DELETE', '${mx.id}', '${mx.ten}', ${lat}, ${lng})">🗑️ Xóa</button>`; 
        }
        mxMarker.bindPopup(mxPopup); mxLayer.addLayer(mxMarker);
      });
    }

    function xoaTuyenThuCong() { document.getElementById('selectTuyen').value = 'ALL'; veLaiTuyenAB(); }
    function timViTriDut() { alert("Phân tích OTDR: Tính năng giữ nguyên không đổi."); }
  </script>
</body>
